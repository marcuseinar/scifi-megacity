// ─── CITY GENERATION ─────────────────────────────────────────────────────────
const neonMeshes=[];   // for animation
const blinkLights=[];  // antenna blinkers

// Pre-pool sign textures — one canvas per sign text, reused across all buildings
const SIGN_TEX=SIGNS.map(text=>makeSignTex(text,pick(NEONS)));

// Static geometry is accumulated into buckets keyed by material and merged once
// generation finishes — a few hundred greebled towers plus street clutter would
// otherwise be many thousands of draw calls.
const BUCKETS=new Map();
function pushGeo(key,mat,g){
  let b=BUCKETS.get(key);
  if(!b){b={mat,geos:[]};BUCKETS.set(key,b);}
  b.geos.push(g);
}
function place(key,mat,g,x,y,z,ry){
  if(ry)g.rotateY(ry);
  g.translate(x,y,z);
  pushGeo(key,mat,g);
}
const BOX_TILE=6;   // world units one texture tile covers on structural boxes
function addBox(key,mat,w,h,d,x,y,z,ry){
  const g=new THREE.BoxGeometry(w,h,d);
  // Without this a scanned map stretches across a whole skyway deck. Faces are
  // ordered px,nx,py,ny,pz,nz — width comes from d on the x faces, w elsewhere.
  const uv=g.attributes.uv;
  const ou=Math.random()*3, ov=Math.random()*3;
  const su=[d,d,w,w,w,w], sv=[h,h,d,d,h,h];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){
    const k=f*4+i;
    uv.setXY(k,uv.getX(k)*su[f]/BOX_TILE+ou,uv.getY(k)*sv[f]/BOX_TILE+ov);
  }
  place(key,mat,g,x,y,z,ry);
}
function flushBuckets(){
  BUCKETS.forEach(b=>{
    if(!b.geos.length)return;
    const merged=mergeGeometries(b.geos,false);
    b.geos.forEach(g=>g.dispose());
    if(!merged)return;
    const m=new THREE.Mesh(merged,b.mat);
    m.frustumCulled=false;   // everything sits inside the fog radius anyway
    scene.add(m);
  });
  BUCKETS.clear();
}

// Facade UVs are scaled so one texture tile covers wu × hu world units
function uvBox(g,w,h,d,wu,hu){
  const uv=g.attributes.uv;
  const ou=Math.random()*4, ov=Math.random()*4;
  const su=[d/wu,d/wu,0,0,w/wu,w/wu];
  const sv=[h/hu,h/hu,0,0,h/hu,h/hu];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){
    const k=f*4+i;
    if(f===2||f===3){uv.setXY(k,ROOF_UV[0],ROOF_UV[1]);continue;}
    uv.setXY(k,uv.getX(k)*su[f]+ou,uv.getY(k)*sv[f]+ov);
  }
  return g;
}
function uvCyl(g,su,sv){
  const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);
  return g;
}


// Swap in a downloaded pack for this facade if one is configured
const TEX_LOADER=new THREE.TextureLoader();
const PACK_CACHE=new Map();
function packTex(url,data,rep){
  const key=url+'|'+rep.join(',');
  let t=PACK_CACHE.get(key);
  if(!t){
    t=TEX_LOADER.load(url);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    if(!data)t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=4;
    PACK_CACHE.set(key,t);
  }
  return t;
}
function applyPack(m,F){
  const p=TEXTURE_PACKS[F.kind];
  if(!p)return;
  const rep=[p.wu||F.wu,p.hu||F.hu];
  if(p.map)          {m.map=packTex(p.map,false,rep); m.color.setHex(0xffffff);}
  if(p.normalMap)     m.normalMap=packTex(p.normalMap,true,rep);
  if(p.roughnessMap){ m.roughnessMap=packTex(p.roughnessMap,true,rep); m.metalnessMap=p.metalnessMap?packTex(p.metalnessMap,true,rep):null;
                      m.metalness=p.metalness!==undefined?p.metalness:F.metal; }
  if(p.wu)F.wu=p.wu;
  if(p.hu)F.hu=p.hu;
  m.needsUpdate=true;
}

// ─── MATERIALS ────────────────────────────────────────────────────────────────
const FACADE_MATS=new Map();
function facadeMat(fi,ti){
  const k=fi+'|'+ti;
  let m=FACADE_MATS.get(k);
  if(!m){
    const F=FACADES[fi];
    // roughness/metalness are baked into the ORM map, so the scalars are
    // multipliers left at 1
    m=new THREE.MeshStandardMaterial({
      map:F.map, color:BTINTS[ti],
      emissiveMap:F.emis, emissive:0xffffff, emissiveIntensity:F.glow,
      normalMap:F.norm, normalScale:new THREE.Vector2(.9,.9),
      roughnessMap:F.orm, metalnessMap:F.orm,
      roughness:1, metalness:1, envMapIntensity:.8
    });
    applyPack(m,F);
    FACADE_MATS.set(k,m);
  }
  return m;
}
// Weathered concrete + the blocky primary accents of a mega-block
const CONC_TINTS=[0x7d8490,0x565d68,0x373d47,0x21262e];
const CONC_MATS=CONC_TINTS.map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,metalness:.08,envMapIntensity:.7}));
CONC_MATS.forEach((m,i)=>usePack(m,'concrete',
  {tint:CONC_TINTS[i],normalScale:.8,rough:1,metal:.05,env:.7}));

const ACC_MATS=[0x9c2f28,0xc09028,0x2c5688,0xad4a22,0x27705f,0x63308a,0xa8a396].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness:.15}));
const GREEBLE_MAT=new THREE.MeshStandardMaterial({color:0x232a36,roughness:.55,metalness:.65,envMapIntensity:1.1});
// Rusted plate on the industrial greebles — rooftop kit, masts, pylons, tanks
usePack(GREEBLE_MAT,'rustplate',{tint:0x6b6f74,normalScale:1,rough:1,metal:1,env:1.1});
const RUST_MAT=new THREE.MeshStandardMaterial({color:0x4a3228,roughness:.9,metalness:.2});
// Architectural light strips are dimmed — there are a lot of them
const STRIP_MATS=NEONS.map(c=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(.38)}));
const BLINK_GEO=new THREE.SphereGeometry(.8,8,8);
const LAMP_MAT=new THREE.MeshBasicMaterial({color:0xffe6b8});

// Street furniture
const TRUNK_MAT=new THREE.MeshStandardMaterial({color:0x2e2620,roughness:.95,metalness:0});
const FOLIAGE_MATS=[0x7e2a72,0x54318c,0xa33580,0x2f6f62,0x8d3f96].map(c=>
  new THREE.MeshStandardMaterial({color:c,roughness:.95,metalness:0,
    emissive:new THREE.Color(c).multiplyScalar(.30)}));
// Sidewalks use a real scanned pack: ambientCG PavingStones038 (CC0 1.0),
// resized to 1024/768/512 and with AO+roughness packed into one file. PAVE_TILE
// is the world size one tile covers, chosen so the pavers read ~35 cm across.
const PAVE_TILE=3;
const PAVEMENT_PACK={
  map:'textures/paving_color.webp',
  normalMap:'textures/paving_normal.webp',
  orm:'textures/paving_orm.webp'        // R = ambient occlusion, G = roughness
};
const PAVE_MAT=new THREE.MeshStandardMaterial({map:paveTex,
  normalMap:canvasNormal(paveTex,2.2),normalScale:new THREE.Vector2(.8,.8),
  roughness:.55,metalness:.25,envMapIntensity:1.0});

// Swap the scans in once they arrive; the procedural canvas stays on screen
// until then, and survives untouched if the files are missing.
(()=>{
  if(!PAVEMENT_PACK)return;
  const load=(url,srgb)=>new Promise(res=>{
    TEX_LOADER.load(url,t=>{
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      if(srgb)t.colorSpace=THREE.SRGBColorSpace;
      t.anisotropy=8;
      res(t);
    },undefined,()=>res(null));
  });
  Promise.all([
    load(PAVEMENT_PACK.map,true),
    load(PAVEMENT_PACK.normalMap,false),
    load(PAVEMENT_PACK.orm,false)
  ]).then(([col,nrm,orm])=>{
    if(col){PAVE_MAT.map=col; PAVE_MAT.color.setHex(0x8f97a8);}   // tint to night
    if(nrm){PAVE_MAT.normalMap=nrm; PAVE_MAT.normalScale.set(1,1);}
    if(orm){
      PAVE_MAT.roughnessMap=orm; PAVE_MAT.aoMap=orm;
      PAVE_MAT.roughness=1; PAVE_MAT.metalness=.08; PAVE_MAT.aoMapIntensity=.7;
    }
    PAVE_MAT.needsUpdate=true;
  });
})();
const CURB_MAT=new THREE.MeshStandardMaterial({color:0x3c414c,roughness:.85,metalness:.1});

// Fake pools of light — additive discs on the pavement, no extra real lights.
// Vertex colours rather than a texture so the falloff never mips into a hard quad.
const POOL_MAT=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,
  opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false});
const POOL_COLS=[0xffc078,0x2fd0ff,0xff3f9a,0x5cff9a,0xb07cff];
function lightPool(x,z,r,ci){
  const g=new THREE.CircleGeometry(r,16); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, n=p.count, col=new Float32Array(n*3);
  const C=new THREE.Color(POOL_COLS[ci%POOL_COLS.length]);
  for(let i=0;i<n;i++){
    const f=1-Math.min(1,Math.hypot(p.getX(i),p.getZ(i))/r);
    const k=f*f;
    col[i*3]=C.r*k; col[i*3+1]=C.g*k; col[i*3+2]=C.b*k;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  place('POOL',POOL_MAT,g,x,.12,z);
}


// ─── BUILDING ────────────────────────────────────────────────────────────────
function addBuilding(bx,bz,bw,bd,bh,style){
  // Primary skin plus a contrasting one for podiums and odd tiers
  const fi=Math.floor(Math.random()*FACADES.length);
  let fi2=Math.floor(Math.random()*FACADES.length);
  if(fi2===fi)fi2=(fi2+1)%FACADES.length;
  const ti=Math.floor(Math.random()*BTINTS.length);
  const ti2=Math.floor(Math.random()*BTINTS.length);
  const F=FACADES[fi], F2=FACADES[fi2];
  const fkey='F'+fi+'_'+ti, fmat=facadeMat(fi,ti);
  const fkey2='G'+fi2+'_'+ti2, fmat2=facadeMat(fi2,ti2);
  const cki=Math.floor(Math.random()*CONC_MATS.length);
  const aci=Math.floor(Math.random()*ACC_MATS.length);
  const sci=Math.floor(Math.random()*STRIP_MATS.length);

  const M=(w,h,d,x,y,z,ry)=>place(fkey,fmat,uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F.wu,F.hu),x,y,z,ry);
  const M2=(w,h,d,x,y,z,ry)=>place(fkey2,fmat2,uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F2.wu,F2.hu),x,y,z,ry);
  const MM=(w,h,d,x,y,z,ry)=>(Math.random()<.25?M2:M)(w,h,d,x,y,z,ry);
  const C=(w,h,d,x,y,z,ry)=>addBox('C'+cki,CONC_MATS[cki],w,h,d,x,y,z,ry);
  const A=(w,h,d,x,y,z,ry)=>addBox('A'+aci,ACC_MATS[aci],w,h,d,x,y,z,ry);
  const G=(w,h,d,x,y,z,ry)=>addBox('Gr',GREEBLE_MAT,w,h,d,x,y,z,ry);
  const S=(w,h,d,x,y,z,ry)=>addBox('S'+sci,STRIP_MATS[sci],w,h,d,x,y,z,ry);
  const Gg=(g,x,y,z,ry)=>place('Gr',GREEBLE_MAT,g,x,y,z,ry);
  const Cg=(g,x,y,z,ry)=>place('C'+cki,CONC_MATS[cki],g,x,y,z,ry);

  // Slab edge where tiers meet, sometimes rimmed with a light strip
  const rim=(x,y,z,w,d)=>{
    S(w,.3,.7,x,y,z-d/2); S(w,.3,.7,x,y,z+d/2);
    S(.7,.3,d,x-w/2,y,z);  S(.7,.3,d,x+w/2,y,z);
  };
  const cornice=(x,y,z,w,d,neon)=>{
    C(w+2.2,1.7,d+2.2,x,y,z);
    if(neon)rim(x,y+1.05,z,w+2.6,d+2.6);
  };
  // Vertical structural ribs down two faces
  const ribs=(x,y,z,w,h,d)=>{
    const n=Math.min(6,Math.max(2,Math.round(w/12)));
    for(let i=0;i<n;i++){
      const rx=x-w/2+(i+.5)*(w/n);
      C(1.7,h*.94,1.2,rx,y,z+d/2+.5);
      C(1.7,h*.94,1.2,rx,y,z-d/2-.5);
    }
  };
  // Flat colour panel bolted onto a face
  const panel=(x,y,z,w,h,d)=>{
    const s=Math.floor(Math.random()*4), ph=h*rnd(.3,.8);
    if(s<2)A(w*rnd(.25,.6),ph,1.2,x+rnd(-.2,.2)*w,y,z+(s?-1:1)*(d/2+.6));
    else   A(1.2,ph,d*rnd(.25,.6),x+(s===2?1:-1)*(w/2+.6),y,z+rnd(-.2,.2)*d);
  };
  // Cantilevered platform sticking out of the mass
  const shelf=(x,y,z,w,d)=>{
    if(Math.random()<.5)C(w*rnd(1.15,1.5),1.5,d*rnd(.3,.6),x,y,z+rnd(-.2,.2)*d);
    else C(w*rnd(.3,.6),1.5,d*rnd(1.15,1.5),x+rnd(-.2,.2)*w,y,z);
  };
  // Rooftop machinery
  const roofKit=(x,y,z,w,d)=>{
    const n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const rw=rnd(2.5,Math.max(3.5,w*.3)),rd=rnd(2.5,Math.max(3.5,d*.3)),rh=rnd(1.8,5.5);
      G(rw,rh,rd,x+rnd(-.3,.3)*w,y+rh/2,z+rnd(-.3,.3)*d);
    }
    if(Math.random()<.5){
      const r=rnd(1.4,2.8),hh=rnd(3,7);
      Gg(new THREE.CylinderGeometry(r,r,hh,8),x+rnd(-.25,.25)*w,y+hh/2,z+rnd(-.25,.25)*d);
    }
    if(Math.random()<.3){
      const g=new THREE.CylinderGeometry(3.4,.5,1.6,10);
      g.rotateX(rnd(.5,1.1));
      Gg(g,x+rnd(-.3,.3)*w,y+2.4,z+rnd(-.3,.3)*d);
    }
  };
  // Mast with a red aircraft blinker
  const mast=(x,y,z,h)=>{
    Gg(new THREE.CylinderGeometry(.3,.6,h,6),x,y+h/2,z);
    const bm=new THREE.Mesh(BLINK_GEO,new THREE.MeshBasicMaterial({color:0xff2200}));
    bm.position.set(x,y+h+1.2,z);
    bm.userData={phase:Math.random()*Math.PI*2,rate:.5+Math.random()*1.5};
    scene.add(bm); blinkLights.push(bm);
  };
  // Vertical neon pinstripes up two corners
  const pinstripes=(x,y,z,w,h,d)=>{
    const hh=h*rnd(.5,.95);
    S(.5,hh,.5,x+w/2,y+hh/2,z+d/2);
    S(.5,hh,.5,x-w/2,y+hh/2,z-d/2);
  };

  let topX=bx,topZ=bz,topW=bw,topD=bd,topY=bh;

  if(style==='stack'){
    // Brutalist mega-block: offset slabs piled up, colour-panelled
    const n=3+Math.floor(Math.random()*3);
    const hs=[]; let tot=0;
    for(let i=0;i<n;i++){const v=rnd(.55,1.5);hs.push(v);tot+=v;}
    let y=0,w=bw,d=bd,x=bx,z=bz;
    for(let i=0;i<n;i++){
      const th=bh*hs[i]/tot;
      if(i){x+=rnd(-.16,.16)*w; z+=rnd(-.16,.16)*d;}
      MM(w,th,d,x,y+th/2,z);
      if(w>18&&Math.random()<.45)ribs(x,y+th/2,z,w,th,d);
      if(Math.random()<.6)panel(x,y+th*rnd(.3,.7),z,w,th,d);
      if(Math.random()<.4)shelf(x,y+th*rnd(.35,.8),z,w,d);
      if(i<n-1)cornice(x,y+th,z,w,d,Math.random()<.2);
      y+=th;
      const s=rnd(.66,.94);
      w=Math.max(9,w*s); d=Math.max(9,d*s);
    }
    topX=x; topZ=z; topW=w; topD=d; topY=y;
    cornice(x,y,z,w,d,true);

  }else if(style==='setback'){
    // Ziggurat: clean concentric setbacks, crowned with a spire
    const n=3+Math.floor(Math.random()*4);
    let y=0,w=bw,d=bd;
    for(let i=0;i<n;i++){
      const th=bh/n*rnd(.75,1.25);
      (i===0?M2:M)(w,th,d,bx,y+th/2,bz);
      if(Math.random()<.5)panel(bx,y+th*.5,bz,w,th,d);
      cornice(bx,y+th,bz,w,d,i===n-1&&Math.random()<.6);
      y+=th; w*=rnd(.7,.86); d*=rnd(.7,.86);
    }
    topW=w; topD=d; topY=y;
    if(Math.random()<.6){
      const sh=bh*rnd(.12,.3);
      Cg(new THREE.CylinderGeometry(.8,Math.min(w,d)*.3,sh,6),bx,y+sh/2,bz);
      topY=y+sh;
    }

  }else if(style==='taper'){
    // Faceted crystal tower
    const seg=pick([4,6,8]);
    const r0=Math.min(bw,bd)*.52, r1=r0*rnd(.3,.65);
    const ry=Math.random()*Math.PI;
    place(fkey,fmat,uvCyl(new THREE.CylinderGeometry(r1,r0,bh,seg,1),2*Math.PI*r0/F.wu,bh/F.hu),bx,bh/2,bz,ry);
    const rings=2+Math.floor(Math.random()*3);
    for(let i=1;i<=rings;i++){
      const t=i/(rings+1), rr=r0+(r1-r0)*t;
      Cg(new THREE.CylinderGeometry(rr+1.1,rr+1.1,2,seg),bx,bh*t,bz,ry);
      if(Math.random()<.5)place('S'+sci,STRIP_MATS[sci],new THREE.CylinderGeometry(rr+1.4,rr+1.4,.4,seg,1,true),bx,bh*t+1.3,bz,ry);
    }
    Cg(new THREE.CylinderGeometry(r1+1,r1+1,1.6,seg),bx,bh+.8,bz,ry);
    topW=r1*1.6; topD=r1*1.6; topY=bh+1.6;

  }else if(style==='core'){
    // Central shaft flanked by lower wings, linked by bridges
    const cw=bw*rnd(.34,.5), cd=bd*rnd(.34,.5);
    M(cw,bh,cd,bx,bh/2,bz);
    ribs(bx,bh/2,bz,cw,bh,cd);
    const wings=2+Math.floor(Math.random()*3);
    for(let i=0;i<wings;i++){
      const a=i/wings*Math.PI*2+rnd(-.3,.3);
      const dist=Math.max(cw,cd)*rnd(.75,1.05);
      const wx=bx+Math.cos(a)*dist, wz=bz+Math.sin(a)*dist;
      const wh=bh*rnd(.3,.72), ww=bw*rnd(.2,.32), wd=bd*rnd(.2,.32);
      M2(ww,wh,wd,wx,wh/2,wz);
      cornice(wx,wh,wz,ww,wd,Math.random()<.3);
      roofKit(wx,wh+1,wz,ww,wd);
      if(Math.random()<.7){                       // skybridge back to the core
        const by=wh*rnd(.45,.85);
        const dx=bx-wx,dz=bz-wz,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
        C(3.2,3.2,len,(bx+wx)/2,by,(bz+wz)/2,ang);
        S(.8,.3,len*.98,(bx+wx)/2,by+1.7,(bz+wz)/2,ang);
      }
    }
    topW=cw; topD=cd; topY=bh;
    cornice(bx,bh,bz,cw,cd,true);

  }else if(style==='ring'){
    // Courtyard housing block: four slabs around a void, bridged across
    const th=bh*rnd(.7,1);
    const arm=bw*.28;
    [[0,-bd/2+arm/2,bw,arm],[0,bd/2-arm/2,bw,arm],
     [-bw/2+arm/2,0,arm,bd-arm*2],[bw/2-arm/2,0,arm,bd-arm*2]].forEach((s,i)=>{
      const hh=th*rnd(.7,1.15);
      MM(s[2],hh,s[3],bx+s[0],hh/2,bz+s[1]);
      if(Math.random()<.7)panel(bx+s[0],hh*rnd(.3,.7),bz+s[1],s[2],hh,s[3]);
      cornice(bx+s[0],hh,bz+s[1],s[2],s[3],Math.random()<.3);
      if(i<2)roofKit(bx+s[0],hh+1,bz+s[1],s[2],s[3]);
    });
    const by=th*rnd(.5,.9);
    C(bw*.9,2.6,3,bx,by,bz);
    S(bw*.86,.28,.5,bx,by+1.5,bz);
    topX=bx-bw/2+arm/2; topW=arm; topD=arm; topY=th;

  }else{ // 'podium'
    // Broad podium in one material, tower in another
    const ph=Math.min(bh*.28,rnd(12,30));
    M2(bw,ph,bd,bx,ph/2,bz);
    cornice(bx,ph,bz,bw,bd,true);
    if(Math.random()<.6)panel(bx,ph*.6,bz,bw,ph,bd);
    const tw=bw*rnd(.42,.62), td=bd*rnd(.42,.62);
    const tx=bx+rnd(-.18,.18)*bw, tz=bz+rnd(-.18,.18)*bd;
    const th=bh-ph;
    const n=2+Math.floor(Math.random()*3);
    let y=ph,w=tw,d=td;
    for(let i=0;i<n;i++){
      const sh=th/n*rnd(.8,1.2);
      M(w,sh,d,tx,y+sh/2,tz);
      if(Math.random()<.45)shelf(tx,y+sh*rnd(.3,.8),tz,w,d);
      if(Math.random()<.5)panel(tx,y+sh*.5,tz,w,sh,d);
      if(i<n-1)cornice(tx,y+sh,tz,w,d,Math.random()<.2);
      y+=sh; w*=rnd(.78,.98); d*=rnd(.78,.98);
    }
    topX=tx; topZ=tz; topW=w; topD=d; topY=y;
    cornice(tx,y,tz,w,d,true);
    if(Math.random()<.5)pinstripes(tx,ph,tz,tw,th,td);
  }

  // Crown detail
  roofKit(topX,topY,topZ,topW,topD);
  if(bh>60&&Math.random()<.75)mast(topX,topY,topZ,rnd(10,26));
  if(bh<55&&Math.random()<.3){                    // domed / pyramid cap on low-rise
    if(Math.random()<.5)
      Cg(new THREE.SphereGeometry(Math.min(topW,topD)*.5,12,8,0,Math.PI*2,0,Math.PI/2),topX,topY,topZ);
    else
      Cg(new THREE.ConeGeometry(Math.min(topW,topD)*.7,Math.min(topW,topD)*.75,4),topX,topY+Math.min(topW,topD)*.37,topZ,Math.PI/4);
  }

  // Neon sign
  if(Math.random()>.4&&bh>18){
    const sm=new THREE.Mesh(
      new THREE.PlaneGeometry(16,4),
      new THREE.MeshBasicMaterial({map:pick(SIGN_TEX),transparent:true,side:THREE.DoubleSide,depthWrite:false})
    );
    const sh=6+Math.random()*(bh*.7);
    const side=Math.floor(Math.random()*4), off=.9;
    if(side===0)      sm.position.set(bx,sh,bz+bd/2+off);
    else if(side===1){sm.position.set(bx,sh,bz-bd/2-off); sm.rotation.y=Math.PI;}
    else if(side===2){sm.position.set(bx+bw/2+off,sh,bz); sm.rotation.y=-Math.PI/2;}
    else              {sm.position.set(bx-bw/2-off,sh,bz); sm.rotation.y= Math.PI/2;}
    sm.userData={phase:Math.random()*Math.PI*2};
    scene.add(sm); neonMeshes.push(sm);
    if(sh<26)lightPool(sm.position.x,sm.position.z,rnd(9,15),Math.floor(Math.random()*4));
  }
  // Tall towers carry a vertical billboard column
  if(bh>90&&Math.random()<.5){
    const bm2=new THREE.Mesh(new THREE.PlaneGeometry(6,26),
      new THREE.MeshBasicMaterial({map:pick(SIGN_TEX),transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.9}));
    bm2.rotation.z=Math.PI/2;
    const holder=new THREE.Group(); holder.add(bm2);
    const side=Math.random()<.5?1:-1;
    holder.position.set(bx+side*(bw/2+1),bh*rnd(.35,.7),bz+rnd(-.2,.2)*bd);
    holder.rotation.y=side>0?-Math.PI/2:Math.PI/2;
    holder.userData={phase:Math.random()*Math.PI*2};
    scene.add(holder);
    neonMeshes.push({material:bm2.material,userData:holder.userData});
  }

  return {x:bx,z:bz,h:bh,w:bw,d:bd};
}

// ─── STREET FURNITURE ────────────────────────────────────────────────────────
function tree(x,z){
  const h=rnd(4.5,8);
  place('TR',TRUNK_MAT,new THREE.CylinderGeometry(.28,.5,h,6),x,h/2,z);
  const fi=Math.floor(Math.random()*FOLIAGE_MATS.length);
  const n=2+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const r=rnd(1.5,2.6);
    place('FO'+fi,FOLIAGE_MATS[fi],new THREE.IcosahedronGeometry(r,0),
      x+rnd(-1.2,1.2),h+rnd(-.6,1.6),z+rnd(-1.2,1.2));
  }
}
function bin(x,z){
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.55,.45,1.3,8),x,.65,z);
  place('C3',CONC_MATS[3],new THREE.CylinderGeometry(.62,.62,.12,8),x,1.34,z);
}
function bench(x,z,ry){
  addBox('C1',CONC_MATS[1],3.6,.25,1.0,x,.75,z,ry);
  addBox('C3',CONC_MATS[3],.35,.75,.9,x-1.4,.38,z,ry);
  addBox('C3',CONC_MATS[3],.35,.75,.9,x+1.4,.38,z,ry);
}
function bollards(x,z,ry){
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  for(let i=-1;i<=1;i++){
    const ox=i*1.8;
    place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.16,.2,1.1,6),x+ox,.55,z);
    place('S'+si,STRIP_MATS[si],new THREE.CylinderGeometry(.22,.22,.14,6),x+ox,1.14,z);
  }
}
function planter(x,z,ry){
  addBox('C2',CONC_MATS[2],3.2,1.0,1.6,x,.5,z,ry);
  const fi=Math.floor(Math.random()*FOLIAGE_MATS.length);
  for(let i=-1;i<=1;i++)
    place('FO'+fi,FOLIAGE_MATS[fi],new THREE.IcosahedronGeometry(rnd(.5,.9),0),x+i*1.1,1.3,z);
}
function kiosk(x,z,ry){
  const ai=Math.floor(Math.random()*ACC_MATS.length);
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  addBox('Gr',GREEBLE_MAT,3.4,3.0,2.6,x,1.5,z,ry);
  addBox('A'+ai,ACC_MATS[ai],4.6,.25,1.5,x,3.15,z+1.6,ry);     // awning
  addBox('S'+si,STRIP_MATS[si],3.0,.5,.2,x,2.4,z+1.35,ry);     // counter light
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.1,.1,3.4,6),x+1.9,1.7,z+1.6);
  lightPool(x,z+1,7,Math.floor(Math.random()*4));
}
function utilityBox(x,z,ry){
  addBox('Gr',GREEBLE_MAT,1.6,1.8,1.1,x,.9,z,ry);
  addBox('S1',STRIP_MATS[1],1.2,.14,.1,x,1.5,z+.6,ry);
}
function hydrant(x,z){
  place('A0',ACC_MATS[0],new THREE.CylinderGeometry(.22,.3,1.0,6),x,.5,z);
  place('A0',ACC_MATS[0],new THREE.SphereGeometry(.26,6,5),x,1.05,z);
}
function adPylon(x,z,ry){
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  addBox('Gr',GREEBLE_MAT,1.4,6.5,.7,x,3.25,z,ry);
  addBox('S'+si,STRIP_MATS[si],1.0,4.4,.12,x,4.2,z+.42,ry);
  addBox('S'+si,STRIP_MATS[si],1.0,4.4,.12,x,4.2,z-.42,ry);
  lightPool(x,z,6,Math.floor(Math.random()*4));
}
function streetLamp(x,z,dir){
  addSolid(x,z,.5,.5);
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.14,.22,11,8),x,5.5,z);
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.08,.08,3.5,6).rotateZ(Math.PI/2),x+dir*1.6,11,z);
  place('LAMP',LAMP_MAT,new THREE.SphereGeometry(.5,8,8),x+dir*3.1,10.9,z);
  lightPool(x+dir*3.1,z,11,0);
}
function addStreetProps(cx,cz,hx,hz){
  for(let side=0;side<4;side++){
    const half=(side<2?hx:hz), other=(side<2?hz:hx);
    const R=other+FURN_OUT;
    const n=2+Math.floor(Math.random()*(half>45?4:3));
    for(let i=0;i<n;i++){
      const span=half*2-10;
      const t=(i+.5)/n*span-span/2+rnd(-2.5,2.5);
      let x,z,ry;
      if(side===0){x=cx+t; z=cz-R; ry=0;}
      else if(side===1){x=cx+t; z=cz+R; ry=Math.PI;}
      else if(side===2){x=cx-R; z=cz+t; ry=Math.PI/2;}
      else             {x=cx+R; z=cz+t; ry=-Math.PI/2;}
      const r=Math.random();
      if(r<.30)      tree(x,z);
      else if(r<.42) bin(x,z);
      else if(r<.53) bench(x,z,ry);
      else if(r<.63) bollards(x,z,ry);
      else if(r<.71) planter(x,z,ry);
      else if(r<.80) kiosk(x,z,ry);
      else if(r<.88) utilityBox(x,z,ry);
      else if(r<.94) hydrant(x,z);
      else           adPylon(x,z,ry);
    }
  }
}
// Paved sidewalk + curb ring for a block
function addPavement(cx,cz,hx,hz){
  const sw=hx*2+PAVE_OUT*2, sd=hz*2+PAVE_OUT*2;
  const g=new THREE.PlaneGeometry(sw,sd); g.rotateX(-Math.PI/2);
  const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*sw/PAVE_TILE,uv.getY(i)*sd/PAVE_TILE);
  g.setAttribute('uv1',uv.clone());     // aoMap samples uv1, not uv
  place('PV',PAVE_MAT,g,cx,.09,cz);
  const h=.42;
  addBox('CB',CURB_MAT,sw+1,h,1,cx,h/2,cz-sd/2);
  addBox('CB',CURB_MAT,sw+1,h,1,cx,h/2,cz+sd/2);
  addBox('CB',CURB_MAT,1,h,sd+1,cx-sw/2,h/2,cz);
  addBox('CB',CURB_MAT,1,h,sd+1,cx+sw/2,h/2,cz);
}

// ─── JAPANESE SIGNAGE ────────────────────────────────────────────────────────
// Shop names as they actually appear on a Japanese street. Rendered through a
// CJK font stack; if a viewer's system has no Japanese face the browser falls
// back and these come out as boxes, so the latin set below stays in rotation.
const JP_SHOPS=['ラーメン','居酒屋','焼鳥','カラオケ','薬局','喫茶','寿司','定食',
                '古書店','電気','質屋','スナック','麻雀','銭湯','鰻','天ぷら',
                '珈琲','酒','肉','魚','花','パン','美容室','写真'];
const JP_FONT='"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","IPAGothic","MS Gothic",sans-serif';
const SIGN_COLS=[0xff2d3a,0xffd23a,0x2de0ff,0xff6ab0,0x8cff5a,0xffffff,0xff8a1e];

// Vertical hanging banner — the tate-kanban that lines every side street
function jpBannerTex(text,col,bg){
  const W=64,H=256;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  x.fillStyle=hex(bg); x.fillRect(0,0,W,H);
  x.strokeStyle=hex(col); x.lineWidth=3; x.strokeRect(4,4,W-8,H-8);
  x.font='36px '+JP_FONT;
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=hex(col); x.shadowBlur=16; x.fillStyle=hex(col);
  const chars=[...text].slice(0,5);
  const step=Math.min(44,(H-40)/chars.length);
  chars.forEach((ch,i)=>{
    const y=H/2-(chars.length-1)*step/2+i*step;
    x.fillText(ch,W/2,y);
    x.shadowBlur=5; x.fillText(ch,W/2,y); x.shadowBlur=16;
  });
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Horizontal shop fascia
function jpFasciaTex(text,col,bg){
  const W=256,H=64;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  x.fillStyle=hex(bg); x.fillRect(0,0,W,H);
  x.font='42px '+JP_FONT;
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=hex(col); x.shadowBlur=18; x.fillStyle=hex(col);
  x.fillText(text,W/2,H/2+2);
  x.shadowBlur=5; x.fillText(text,W/2,H/2+2);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Pooled so a few hundred shops share a handful of textures
const BANNER_MATS=[],FASCIA_MATS=[];
const SIGN_ANIM=[];        // pooled sign materials, pulsed as a group
function buildSignPools(){
  for(let i=0;i<14;i++){
    const col=pick(SIGN_COLS), bg=pick([0x0a0a0c,0x140608,0x0c1014,0x1a0d04]);
    const bm=new THREE.MeshBasicMaterial({map:jpBannerTex(pick(JP_SHOPS),col,bg),
      side:THREE.DoubleSide,transparent:true,depthWrite:false});
    const fm=new THREE.MeshBasicMaterial({map:jpFasciaTex(pick(JP_SHOPS),col,bg),
      side:THREE.DoubleSide,transparent:true,depthWrite:false});
    bm.userData.phase=Math.random()*Math.PI*2;
    fm.userData.phase=Math.random()*Math.PI*2;
    SIGN_ANIM.push(bm,fm);
    BANNER_MATS.push(bm); FASCIA_MATS.push(fm);
  }
}

// ─── SHOPFRONT ROW ───────────────────────────────────────────────────────────
// The thing a city needs to feel inhabited is frontage at human scale: warm
// interiors spilling onto the pavement, awnings, shutters, signage at eye
// level. Towers alone read as scenery, not a place.
const SHOP_WALL=[0xe8e4dc,0xd8d2c4,0xf0eee8,0xc9c4b8,0xe0d8cc].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:.05}));
const SHOP_GLOW=[0xffdca8,0xfff0d0,0xffe8b0,0xd8f0ff].map(
  c=>new THREE.MeshBasicMaterial({color:c}));
const SHUTTER_MAT=new THREE.MeshStandardMaterial({color:0x6a6f78,roughness:.7,metalness:.5});
const AWNING=[0x9c2f28,0x1f5f4a,0x2c4b88,0xb5741e,0x6a2f6a,0xc9c4b8].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:.02}));
const VEND_GLOW=[0xff3a3a,0x3aa0ff,0xffffff].map(c=>new THREE.MeshBasicMaterial({color:c}));

function vendingMachine(x,z,ry){
  addSolid(x,z,2.0,2.0);
  addBox('SHW0',SHOP_WALL[0],1.9,2.0,.9,x,1.0,z,ry);
  const vi=Math.random()*VEND_GLOW.length|0;
  place('VG'+vi,VEND_GLOW[vi],new THREE.BoxGeometry(1.5,1.3,.12),
        x+Math.sin(ry)*.5,1.25,z+Math.cos(ry)*.5,ry);
  if(Math.random()<.5)lightPool(x+Math.sin(ry)*1.6,z+Math.cos(ry)*1.6,2.4,1);
}

// One shop unit, built in local space then rotated onto the block edge
function shopUnit(bx,bz,ry,w,depth){
  const S=(gx,gy,gz)=>[bx+Math.cos(ry)*gx-Math.sin(ry)*gz, gy, bz+Math.sin(ry)*gx+Math.cos(ry)*gz];
  const wi=Math.random()*SHOP_WALL.length|0;
  const storeys=Math.random()<.45?2:1;
  const h=storeys===2?rnd(6.4,8.0):rnd(3.8,4.8);

  // shell — solid, and square to the world since ry is a right angle
  {
    const across=Math.abs(Math.cos(ry))>.5?w:depth;
    const along =Math.abs(Math.cos(ry))>.5?depth:w;
    addSolid(bx,bz,across,along);
  }
  let p=S(0,h/2,0);
  addBox('SHW'+wi,SHOP_WALL[wi],w,h,depth,p[0],p[1],p[2],ry);
  // parapet
  p=S(0,h+.35,0);
  addBox('CB',CURB_MAT,w+.5,.7,depth+.5,p[0],p[1],p[2],ry);
  // tiled plinth — stops the frontage reading as one blank slab
  p=S(0,.45,depth/2+.05);
  addBox('CB',CURB_MAT,w,.9,.28,p[0],p[1],p[2],ry);
  // party wall between neighbours
  p=S(w/2,h/2,depth/2+.02);
  addBox('CB',CURB_MAT,.22,h,.35,p[0],p[1],p[2],ry);
  // service riser and meter box down one side
  if(Math.random()<.6){
    p=S(rnd(-.4,.4)*w,h*.5,depth/2+.18);
    place('G',GREEBLE_MAT,new THREE.CylinderGeometry(.11,.11,h*.85,6),p[0],p[1],p[2]);
  }
  if(Math.random()<.45){
    p=S(rnd(-.35,.35)*w,2.9,depth/2+.22);
    addBox('G',GREEBLE_MAT,.55,.7,.3,p[0],p[1],p[2],ry);
  }

  const front=depth/2+.06;
  if(Math.random()<.72){
    // open shop: glowing interior behind glass, warm spill on the pavement
    const gw=w-1.2, gh=2.6;
    const gi=Math.random()*SHOP_GLOW.length|0;
    p=S(0,1.65,front);
    place('SG'+gi,SHOP_GLOW[gi],new THREE.BoxGeometry(gw,gh,.1),p[0],p[1],p[2],ry);
    if(Math.random()<.35){                    // sparingly: these blend additively
      p=S(0,1.65,front+.9);
      lightPool(p[0],p[2],rnd(2.8,4.2),0);
    }
    // awning
    if(Math.random()<.62){
      const ai=Math.random()*AWNING.length|0;
      p=S(0,3.35,front+.85);
      addBox('AW'+ai,AWNING[ai],w-.4,.16,1.9,p[0],p[1],p[2],ry);
      p=S(0,3.05,front+1.75);
      addBox('AW'+ai,AWNING[ai],w-.4,.75,.14,p[0],p[1],p[2],ry);
    }
  }else{
    // closed: corrugated roller shutter
    p=S(0,1.6,front);
    addBox('SHUT',SHUTTER_MAT,w-1.0,3.0,.14,p[0],p[1],p[2],ry);
  }

  // doorway offset to one side, dark against the lit window
  {
    const dx=(Math.random()<.5?-1:1)*(w/2-.85);
    p=S(dx,1.05,front+.02);
    addBox('SHUT',SHUTTER_MAT,1.0,2.1,.1,p[0],p[1],p[2],ry);
  }
  // fascia sign above the opening
  if(Math.random()<.8){
    const fi=Math.random()*FASCIA_MATS.length|0;
    p=S(0,h*(storeys===2?.62:.82),front+.12);
    place('FAS'+fi,FASCIA_MATS[fi],new THREE.PlaneGeometry(w-.3,1.9),p[0],p[1],p[2],ry);
  }
  // projecting vertical banner
  if(Math.random()<.55){
    const bi=Math.random()*BANNER_MATS.length|0;
    p=S(rnd(-.25,.25)*w,h*.52,front+1.35);
    place('BAN'+bi,BANNER_MATS[bi],new THREE.PlaneGeometry(1.3,4.2),
          p[0],p[1],p[2],ry+Math.PI/2);
  }
  // upper-floor window
  if(storeys===2){
    p=S(rnd(-.2,.2)*w,h*.75,front);
    place('SG0',SHOP_GLOW[Math.random()<.5?0:3],
          new THREE.BoxGeometry(w*.55,1.5,.08),p[0],p[1],p[2],ry);
    // aircon box
    p=S(rnd(-.3,.3)*w,h*.62,front-.1);
    addBox('G',GREEBLE_MAT,1.1,.8,.7,p[0],p[1],p[2],ry);
  }
}

// Line the road-facing edges of a block with shops
function shopRow(cx,cz,hx,hz){
  const depth=SHOP_DEPTH;
  const sides=[[0,1],[Math.PI,-1],[Math.PI/2,0],[-Math.PI/2,0]];
  // two of the four edges, so blocks stay varied and geometry stays bounded
  const chosen=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,2);
  chosen.forEach(si=>{
    const half=(si<2?hx:hz), other=(si<2?hz:hx);
    const inset=other+SHOP_OUT-depth/2;
    const span=half*2-8;
    let t=-span/2;
    while(t<span/2-5){
      const w=rnd(4.5,8);
      if(t+w>span/2)break;
      const c=t+w/2;
      let x,z,ry;
      if(si===0){x=cx+c; z=cz-inset; ry=Math.PI;}
      else if(si===1){x=cx+c; z=cz+inset; ry=0;}
      else if(si===2){x=cx-inset; z=cz+c; ry=Math.PI/2;}
      else            {x=cx+inset; z=cz+c; ry=-Math.PI/2;}
      shopUnit(x,z,ry,w-.5,depth);
      t+=w+rnd(.2,1.0);
    }
    // a vending machine or two out on the kerb
    if(Math.random()<.5){
      const c=rnd(-.35,.35)*span;
      let x,z,ry;
      const out=other+FURN_OUT;
      if(si===0){x=cx+c; z=cz-out; ry=Math.PI;}
      else if(si===1){x=cx+c; z=cz+out; ry=0;}
      else if(si===2){x=cx-out; z=cz+c; ry=Math.PI/2;}
      else            {x=cx+out; z=cz+c; ry=-Math.PI/2;}
      vendingMachine(x,z,ry);
    }
  });
}


// ─── CITY PLAN ───────────────────────────────────────────────────────────────
// The layout used to be a perfect lattice: every road straight, every block the
// same size. This builds an explicit plan first and everything else reads from
// it. Roads are irregularly spaced, carry a type, and may jog sideways as they
// cross a cross-street, so they zigzag rather than running dead straight from
// one edge of the map to the other. Blocks stay rectangular — rotating them
// would break shop placement, pedestrian loops and the AABB collision all at
// once — but no two are the same size, and some are given over to a plaza, a
// park or a landmark.
const R_MAJOR=0, R_MINOR=1, R_PED=2;
const ROAD_W=[16,11.5,9];                  // drivable/paved width by type
const PAVE_OUT=6.5;                        // kerb to nominal block edge
const SHOP_OUT=0.8, WALK_A=1.2, WALK_B=4.1, FURN_OUT=5.2, BUILD_IN=7.5;

const PLAN={xs:[],zs:[],blocks:[],carPaths:[],pedWays:[]};

function buildPlan(){
  // 1. irregular road spacing, and a type per road
  const mkLines=()=>{
    const L=[];
    let p=-HALF+rnd(20,50);
    while(p<HALF-70){
      const r=Math.random();
      const type=r<.22?R_PED:(r<.52?R_MINOR:R_MAJOR);
      L.push({base:p,type,w:ROAD_W[type],
              oneway:type===R_MINOR?(Math.random()<.5?1:-1):0,
              off:[]});
      p+=rnd(96,168);
    }
    return L;
  };
  PLAN.xs=mkLines(); PLAN.zs=mkLines();

  // 2. jogs: a road's position shifts as it crosses each cross-street, so it
  //    steps through the city instead of running straight
  const nz=PLAN.zs.length, nx=PLAN.xs.length;
  PLAN.xs.forEach(r=>{
    let cur=r.base;
    for(let j=0;j<=nz;j++){
      if(j>0&&Math.random()<.30)cur+=rnd(-26,26);
      r.off[j]=cur;
    }
  });
  PLAN.zs.forEach(r=>{
    let cur=r.base;
    for(let i=0;i<=nx;i++){
      if(i>0&&Math.random()<.30)cur+=rnd(-26,26);
      r.off[i]=cur;
    }
  });

  // 3. blocks are what is left between the roads
  for(let i=0;i<nx-1;i++)for(let j=0;j<nz-1;j++){
    const a=PLAN.xs[i],b=PLAN.xs[i+1],c=PLAN.zs[j],d=PLAN.zs[j+1];
    // off[k] is a road's position in the band between cross-streets k-1 and k.
    // This block lies in band j+1 across, and band i+1 along — reading off[j]
    // and off[i] here put blocks against where a jogged road used to be, which
    // dropped buildings into the carriageway.
    const x0=a.off[j+1]+a.w/2+PAVE_OUT, x1=b.off[j+1]-b.w/2-PAVE_OUT;
    const z0=c.off[i+1]+c.w/2+PAVE_OUT, z1=d.off[i+1]-d.w/2-PAVE_OUT;
    const hx=(x1-x0)/2, hz=(z1-z0)/2;
    if(hx<24||hz<24)continue;                    // too thin to be a block
    PLAN.blocks.push({cx:(x0+x1)/2,cz:(z0+z1)/2,hx,hz,i,j,kind:'city',
      pedSides:{x0:a.type===R_PED,x1:b.type===R_PED,z0:c.type===R_PED,z1:d.type===R_PED}});
  }

  // 4. reserve the special blocks. The landmark wants to be central and large,
  //    so it can be seen from most of the city.
  const byCentral=[...PLAN.blocks].sort((p,q)=>
    (Math.hypot(p.cx,p.cz)-Math.min(p.hx,p.hz)*2)-(Math.hypot(q.cx,q.cz)-Math.min(q.hx,q.hz)*2));
  if(byCentral[0])byCentral[0].kind='landmark';
  const big=[...PLAN.blocks].filter(b=>b.kind==='city')
    .sort((p,q)=>(q.hx*q.hz)-(p.hx*p.hz));
  if(big[0])big[0].kind='plaza';                 // the round block
  if(big[1])big[1].kind='museum';
  if(big[2])big[2].kind='park';
  if(big[3])big[3].kind='park';

  // 5. drivable polylines for the traffic, skipping the pedestrian streets
  PLAN.xs.forEach((r,i)=>{
    if(r.type===R_PED){PLAN.pedWays.push({axis:'x',r,i});return;}
    const pts=[];
    for(let j=0;j<=nz;j++){
      const z0=j===0?-HALF:PLAN.zs[j-1].off[i]??-HALF;
      const z1=j>=nz?HALF:PLAN.zs[j].off[i]??HALF;
      pts.push([r.off[j],z0],[r.off[j],z1]);
    }
    PLAN.carPaths.push({pts,oneway:r.oneway,w:r.w});
  });
  PLAN.zs.forEach((r,j)=>{
    if(r.type===R_PED){PLAN.pedWays.push({axis:'z',r,j});return;}
    const pts=[];
    for(let i=0;i<=nx;i++){
      const x0=i===0?-HALF:PLAN.xs[i-1].off[j]??-HALF;
      const x1=i>=nx?HALF:PLAN.xs[i].off[j]??HALF;
      pts.push([x0,r.off[i]],[x1,r.off[i]]);
    }
    PLAN.carPaths.push({pts,oneway:r.oneway,w:r.w});
  });
}

// ─── ROAD SURFACES ───────────────────────────────────────────────────────────
// The ground plane is already tarmac, so roads need no surface of their own —
// only a centre line where traffic runs both ways, and paving where a street is
// closed to cars.
function layRoads(){
  const nz=PLAN.zs.length,nx=PLAN.xs.length;
  const paved=(x,z,w,d)=>{
    const g=new THREE.PlaneGeometry(w,d); g.rotateX(-Math.PI/2);
    const uv=g.attributes.uv;
    for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/PAVE_TILE,uv.getY(i)*d/PAVE_TILE);
    g.setAttribute('uv1',uv.clone());
    place('PV',PAVE_MAT,g,x,.10,z);
  };
  PLAN.xs.forEach((r,i)=>{
    const ped=r.type===R_PED;
    for(let j=0;j<=nz;j++){
      const z0=j===0?-HALF:(PLAN.zs[j-1].off[i]??-HALF);
      const z1=j>=nz?HALF:(PLAN.zs[j].off[i]??HALF);
      if(z1<=z0+1)continue;
      if(ped)paved(r.off[j],(z0+z1)/2,r.w,z1-z0);
      else if(!r.oneway)
        addBox('LN',LINE_MAT,.55,.02,(z1-z0)*.88,r.off[j],.08,(z0+z1)/2);
    }
  });
  PLAN.zs.forEach((r,j)=>{
    const ped=r.type===R_PED;
    for(let i=0;i<=nx;i++){
      const x0=i===0?-HALF:(PLAN.xs[i-1].off[j]??-HALF);
      const x1=i>=nx?HALF:(PLAN.xs[i].off[j]??HALF);
      if(x1<=x0+1)continue;
      if(ped)paved((x0+x1)/2,r.off[i],x1-x0,r.w);
      else if(!r.oneway)
        addBox('LN',LINE_MAT,(x1-x0)*.88,.02,.55,(x0+x1)/2,.08,r.off[i]);
    }
  });
  // pedestrian streets get lanterns and seating down the middle
  PLAN.pedWays.forEach(pw=>{
    const r=pw.r, along=pw.axis==='x';
    for(let t=-HALF+30;t<HALF-30;t+=rnd(20,34)){
      const idx=Math.max(0,Math.min(r.off.length-1,Math.round((t+HALF)/CELL)));
      const x=along?r.off[idx]:t, z=along?t:r.off[idx];
      place('LAMP',LAMP_MAT,new THREE.SphereGeometry(.3,6,5),x,3.6,z);
      lightPool(x,z,5,0);
      if(Math.random()<.5)bench(x+rnd(-2,2),z+rnd(-2,2),Math.random()*Math.PI);
      if(Math.random()<.35)planter(x+rnd(-3,3),z+rnd(-3,3),Math.random()*Math.PI);
    }
  });
}

// ─── COLLISION ───────────────────────────────────────────────────────────────
// Solids are registered as axis-aligned boxes at generation time and bucketed
// into a coarse spatial hash, so a move tests a handful of candidates rather
// than a few thousand. Movement resolves one axis at a time, which makes the
// player slide along a wall instead of sticking to it.
const SOLID_CELL=24;
const SOLIDS=new Map();
function solidKey(ix,iz){return ix*8192+iz;}
function addSolid(x,z,w,d){
  const x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2;
  const box={x0,x1,z0,z1};
  const i0=Math.floor(x0/SOLID_CELL),i1=Math.floor(x1/SOLID_CELL);
  const j0=Math.floor(z0/SOLID_CELL),j1=Math.floor(z1/SOLID_CELL);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    const k=solidKey(i,j);
    let a=SOLIDS.get(k);
    if(!a){a=[];SOLIDS.set(k,a);}
    a.push(box);
  }
}
// Circle of radius r at (x,z) against any registered box
function blocked(x,z,r){
  const i0=Math.floor((x-r)/SOLID_CELL),i1=Math.floor((x+r)/SOLID_CELL);
  const j0=Math.floor((z-r)/SOLID_CELL),j1=Math.floor((z+r)/SOLID_CELL);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    const a=SOLIDS.get(solidKey(i,j));
    if(!a)continue;
    for(let n=0;n<a.length;n++){
      const b=a[n];
      if(x+r>b.x0&&x-r<b.x1&&z+r>b.z0&&z-r<b.z1)return true;
    }
  }
  return false;
}
// Slide-along-walls move. If the start point is already inside something —
// which can happen on a mode switch or a respawn — movement is left free so
// the player can walk back out rather than being sealed in.
function moveSolid(px,pz,nx,nz,r){
  if(blocked(px,pz,r))return [nx,nz];
  let ox=px,oz=pz;
  if(!blocked(nx,oz,r))ox=nx;
  if(!blocked(ox,nz,r))oz=nz;
  return [ox,oz];
}

// ─── STREET CROSS-SECTION ────────────────────────────────────────────────────
// Every distance below is measured out from a block's centre. Collision only
// feels fair if the space it constrains was laid out for movement, so the
// walking lane is reserved: nothing is ever placed inside it. Street furniture
// goes in its own strip against the kerb, and the roadway is sized so a car at
// full lane offset still clears the pavement.
const SHOP_DEPTH= 5.5;

// ─── LOT SUBDIVISION ─────────────────────────────────────────────────────────
// Three fixed layouts repeated across a hundred identical blocks is what read as
// artificial — far more than any texture did. Blocks are now cut into irregular
// plots by recursive binary split, occasionally leaving a gap between halves
// that becomes a back alley. Roads, traffic lanes and the minimap are untouched,
// so none of the systems that assume a fixed grid have to change.
const MIN_LOT=15;

function splitLots(x,z,w,d,depth,lots,alleys){
  const tooSmall=w<MIN_LOT*2.1&&d<MIN_LOT*2.1;
  if(depth<=0||tooSmall||(depth<3&&Math.random()<.28)){
    lots.push({x,z,w,d});
    return;
  }
  // split the longer side, but not always — that alone is a visible rhythm
  let horiz=w>d;
  if(Math.random()<.22)horiz=!horiz;
  const span=horiz?w:d;
  // sometimes leave a slot between the halves for an alley
  const gap=(depth>=2&&span>44&&Math.random()<.34)?rnd(3.2,5.4):0;
  const usable=span-gap;
  const f=rnd(.34,.66);
  const a=usable*f, b=usable-a;
  if(a<MIN_LOT||b<MIN_LOT){ lots.push({x,z,w,d}); return; }

  if(horiz){
    splitLots(x-w/2+a/2,z,a,d,depth-1,lots,alleys);
    splitLots(x+w/2-b/2,z,b,d,depth-1,lots,alleys);
    if(gap)alleys.push({x:x-w/2+a+gap/2,z,w:gap,d,horiz:false});
  }else{
    splitLots(x,z-d/2+a/2,w,a,depth-1,lots,alleys);
    splitLots(x,z+d/2-b/2,w,b,depth-1,lots,alleys);
    if(gap)alleys.push({x,z:z-d/2+a+gap/2,w,d:gap,horiz:true});
  }
}

// A back alley: damp ground, a bare bulb or two, pipework, extractor fans and
// the odd sign facing into a space three metres wide.
function dressAlley(al){
  const long=al.horiz?al.w:al.d;
  const n=Math.max(1,Math.round(long/14));
  for(let i=0;i<n;i++){
    const t=(i+.5)/n*long-long/2;
    const ax=al.x+(al.horiz?t:0), az=al.z+(al.horiz?0:t);
    if(Math.random()<.75){                       // bulb strung over the alley
      place('LAMP',LAMP_MAT,new THREE.SphereGeometry(.22,6,5),ax,rnd(3.4,4.6),az);
      lightPool(ax,az,rnd(2.6,3.8),Math.random()<.5?0:2);
    }
    if(Math.random()<.6){                        // extractor fan / condenser
      const side=(Math.random()<.5?-1:1)*(al.horiz?al.d:al.w)/2;
      addBox('G',GREEBLE_MAT,1.0,.9,.6,
             ax+(al.horiz?0:side),rnd(2.2,3.4),az+(al.horiz?side:0));
    }
    if(Math.random()<.5){                        // crates and bins
      addBox('CB',CURB_MAT,rnd(.7,1.2),rnd(.6,1.1),rnd(.7,1.2),
             ax+rnd(-.8,.8),.5,az+rnd(-.8,.8),Math.random()*3);
    }
    if(Math.random()<.35){                        // a sign facing into the alley
      const bi=Math.random()*BANNER_MATS.length|0;
      const side=(Math.random()<.5?-1:1)*((al.horiz?al.d:al.w)/2-.2);
      place('BAN'+bi,BANNER_MATS[bi],new THREE.PlaneGeometry(.9,2.8),
            ax+(al.horiz?0:side),rnd(3.0,4.2),az+(al.horiz?side:0),
            al.horiz?0:Math.PI/2);
    }
  }
}

// Vacant plot: hoarding, gravel, a parked van, vending machines
function vacantLot(l){
  addSolid(l.x,l.z,l.w-1,l.d-1);
  const g=new THREE.PlaneGeometry(l.w-1,l.d-1); g.rotateX(-Math.PI/2);
  place('PV',PAVE_MAT,g,l.x,.11,l.z);
  const hh=2.2;
  addBox('SHUT',SHUTTER_MAT,l.w-1,hh,.16,l.x,hh/2,l.z-l.d/2+.5);
  addBox('SHUT',SHUTTER_MAT,l.w-1,hh,.16,l.x,hh/2,l.z+l.d/2-.5);
  addBox('SHUT',SHUTTER_MAT,.16,hh,l.d-1,l.x-l.w/2+.5,hh/2,l.z);
  addBox('SHUT',SHUTTER_MAT,.16,hh,l.d-1,l.x+l.w/2-.5,hh/2,l.z);
  if(Math.random()<.6)lightPool(l.x,l.z,Math.min(l.w,l.d)*.4,3);
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.13,.13,7,6),
        l.x+l.w/2-1.6,3.5,l.z-l.d/2+1.6);
}

// ─── VIDEO BILLBOARDS ────────────────────────────────────────────────────────
// A "PLAY PEGASUS" campaign running on screens across the city. Every hoarding
// shares one <video> and one VideoTexture, so the whole campaign is a single
// draw call and every screen is naturally in sync — which is what a real ad
// buy looks like anyway. Autoplay is only permitted while muted, so the video
// is muted and playsinline, and playback is also kicked off from the ENTER
// click because iOS wants a user gesture.
let adVideo=null,adTex=null,AD_MAT=null,AD_POSTER=null;
const AD_ASPECT=768/494;

function initAdVideo(){
  const v=document.createElement('video');
  v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true;
  v.setAttribute('muted',''); v.setAttribute('playsinline','');
  v.preload='auto'; v.crossOrigin='anonymous';
  const mp4=document.createElement('source');
  mp4.src='media/pegasus.mp4'; mp4.type='video/mp4';
  const webm=document.createElement('source');
  webm.src='media/pegasus.webm'; webm.type='video/webm';
  v.appendChild(mp4); v.appendChild(webm);
  v.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(v);
  adVideo=v;

  adTex=new THREE.VideoTexture(v);
  adTex.colorSpace=THREE.SRGBColorSpace;
  adTex.minFilter=THREE.LinearFilter;
  adTex.magFilter=THREE.LinearFilter;
  adTex.generateMipmaps=false;

  // A still of the same ad stands in until the video has decoded a frame, so a
  // hoarding is never a blank white rectangle.
  AD_POSTER=new THREE.TextureLoader().load('media/pegasus_poster.jpg',t=>{
    t.colorSpace=THREE.SRGBColorSpace;
  },undefined,()=>{});
  AD_MAT=new THREE.MeshBasicMaterial({map:AD_POSTER,toneMapped:false});
  v.addEventListener('playing',()=>{ AD_MAT.map=adTex; AD_MAT.needsUpdate=true; },{once:true});
  v.play().catch(()=>{});   // may be refused until a gesture; ENTER retries
}
function startAdVideo(){ if(adVideo)adVideo.play().catch(()=>{}); }

// One hoarding: screen, bezel, and a lit strip along the bottom
function addBillboard(x,y,z,ry,w){
  const h=w/AD_ASPECT;
  const g=new THREE.PlaneGeometry(w,h);
  place('AD',AD_MAT,g,x,y,z,ry);
  const n=[Math.sin(ry),Math.cos(ry)];          // facing direction
  const bx=x-n[0]*0.25, bz=z-n[1]*0.25;
  addBox('C3',CONC_MATS[3],w+1.6,h+1.6,.5,bx,y,bz,ry);
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  addBox('S'+si,STRIP_MATS[si],w+1.6,.35,.7,x-n[0]*.1,y-h/2-.9,z-n[1]*.1,ry);
  // gantry legs when it stands clear of a wall
  return {w,h};
}

// Hoardings go up facing the streets, on building flanks and above the shops
function addCampaign(){
  const B=PLAN.blocks.filter(b=>b.kind==='city');
  let placed=0;
  B.forEach(b=>{
    if(Math.random()>.45)return;
    const side=Math.floor(Math.random()*4);
    const w=rnd(14,26), h=w/AD_ASPECT;
    const y=rnd(16,34);
    let x,z,ry;
    const ox=b.hx+SHOP_OUT+0.5, oz=b.hz+SHOP_OUT+0.5;
    if(side===0){x=b.cx+rnd(-.5,.5)*b.hx; z=b.cz-oz; ry=Math.PI;}
    else if(side===1){x=b.cx+rnd(-.5,.5)*b.hx; z=b.cz+oz; ry=0;}
    else if(side===2){x=b.cx-ox; z=b.cz+rnd(-.5,.5)*b.hz; ry=Math.PI/2;}
    else             {x=b.cx+ox; z=b.cz+rnd(-.5,.5)*b.hz; ry=-Math.PI/2;}
    addBillboard(x,y,z,ry,w);
    lightPool(x,z,w*.5,1);
    placed++;
  });
  // a pair of large ones over the plaza and beside the landmark, so the campaign
  // reads as citywide rather than incidental
  const special=PLAN.blocks.filter(b=>b.kind==='plaza'||b.kind==='landmark');
  special.forEach(b=>{
    const w=46;
    addBillboard(b.cx,52,b.cz-b.hz-SHOP_OUT-1,Math.PI,w);
    placed++;
  });
  return placed;
}

// ─── SPECIAL BLOCKS ──────────────────────────────────────────────────────────
// A circular plaza: a ring of shops facing inward around an open circle with a
// monument at the centre. The one genuinely round block in the city.
function plazaBlock(b){
  const r=Math.min(b.hx,b.hz)-9;
  const g=new THREE.CircleGeometry(r,40); g.rotateX(-Math.PI/2);
  const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*r*2/PAVE_TILE,uv.getY(i)*r*2/PAVE_TILE);
  g.setAttribute('uv1',uv.clone());
  place('PV',PAVE_MAT,g,b.cx,.13,b.cz);

  const n=Math.max(10,Math.round(2*Math.PI*r/13));
  for(let k=0;k<n;k++){
    const a=k/n*Math.PI*2;
    const rr=r+4.2;
    // each unit faces the centre of the circle
    shopUnit(b.cx+Math.cos(a)*rr,b.cz+Math.sin(a)*rr,-a+Math.PI/2,rnd(8,11),5.5);
    addSolid(b.cx+Math.cos(a)*rr,b.cz+Math.sin(a)*rr,7,7);
  }
  // monument
  const mh=rnd(16,26);
  place('C1',CONC_MATS[1],new THREE.CylinderGeometry(2.6,4.2,3,12),b.cx,1.5,b.cz);
  place('C0',CONC_MATS[0],new THREE.CylinderGeometry(.8,1.9,mh,10),b.cx,3+mh/2,b.cz);
  place('S0',STRIP_MATS[0],new THREE.SphereGeometry(1.5,10,8),b.cx,3+mh+1.2,b.cz);
  addSolid(b.cx,b.cz,8,8);
  lightPool(b.cx,b.cz,r*.8,0);
  for(let k=0;k<8;k++){
    const a=Math.random()*Math.PI*2, d=rnd(r*.35,r*.85);
    if(Math.random()<.5)tree(b.cx+Math.cos(a)*d,b.cz+Math.sin(a)*d);
    else bench(b.cx+Math.cos(a)*d,b.cz+Math.sin(a)*d,-a);
  }
}

// The overlord tower: deliberately the tallest thing in the city, on its own
// plinth, so it reads as a landmark from anywhere on the map.
function landmarkBlock(b){
  const pw=b.hx*1.5,pd=b.hz*1.5;
  addBox('C3',CONC_MATS[3],pw,5,pd,b.cx,2.5,b.cz);
  addSolid(b.cx,b.cz,pw,pd);
  for(let s=0;s<4;s++){                          // approach steps
    const t=(s+1)*1.6;
    addBox('C2',CONC_MATS[2],pw-t*2,1.2,pd-t*2,b.cx,5+s*1.2,b.cz);
  }
  const w=Math.min(b.hx,b.hz)*.85;
  const H=430;
  addBuilding(b.cx,b.cz,w,w,H,'taper');
  addSolid(b.cx,b.cz,w,w);
  // beacon mast and a ring of red lamps
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.5,1.6,60,8),b.cx,H+30,b.cz);
  for(let k=0;k<4;k++){
    const a=k/4*Math.PI*2;
    const bm=new THREE.Mesh(BLINK_GEO,new THREE.MeshBasicMaterial({color:0xff2200}));
    bm.position.set(b.cx+Math.cos(a)*w*.42,H*.72,b.cz+Math.sin(a)*w*.42);
    bm.userData={phase:k*.7,rate:.5};
    scene.add(bm); blinkLights.push(bm);
  }
  lightPool(b.cx,b.cz,Math.min(pw,pd)*.45,2);
}

// A museum: low, wide, colonnaded, with a dome — a deliberate change of rhythm
// after a hundred towers.
function museumBlock(b){
  const w=b.hx*1.5,d=b.hz*1.5,h=22;
  addBox('C0',CONC_MATS[0],w,3,d,b.cx,1.5,b.cz);
  addBox('C1',CONC_MATS[1],w*.86,h,d*.86,b.cx,3+h/2,b.cz);
  addSolid(b.cx,b.cz,w*.9,d*.9);
  const n=Math.max(6,Math.round(w/9));
  for(let k=0;k<n;k++){                          // colonnade along the front
    const x=b.cx-w*.43+(k+.5)*(w*.86/n);
    place('C0',CONC_MATS[0],new THREE.CylinderGeometry(1.1,1.1,h*.8,10),x,3+h*.4,b.cz+d*.44);
  }
  addBox('C0',CONC_MATS[0],w*.9,2.2,d*.06,b.cx,3+h*.82,b.cz+d*.45);
  place('C1',CONC_MATS[1],
        new THREE.SphereGeometry(Math.min(w,d)*.22,18,12,0,Math.PI*2,0,Math.PI/2),
        b.cx,3+h,b.cz);
  const si=Math.random()*BANNER_MATS.length|0;
  place('BAN'+si,BANNER_MATS[si],new THREE.PlaneGeometry(3.2,10),
        b.cx-w*.3,3+h*.5,b.cz+d*.47);
  lightPool(b.cx,b.cz+d*.5,Math.min(w,d)*.4,1);
}

function parkBlock(b){
  const pm=new THREE.Mesh(new THREE.PlaneGeometry(b.hx*1.85,b.hz*1.85),
    new THREE.MeshStandardMaterial({color:0x121c14,roughness:.95}));
  pm.rotation.x=-Math.PI/2; pm.position.set(b.cx,.14,b.cz); scene.add(pm);
  const n=Math.round(b.hx*b.hz/240);
  for(let i=0;i<n;i++)tree(b.cx+rnd(-.85,.85)*b.hx,b.cz+rnd(-.85,.85)*b.hz);
  for(let i=0;i<4;i++)bench(b.cx+rnd(-.7,.7)*b.hx,b.cz+rnd(-.7,.7)*b.hz,Math.random()*Math.PI);
  bin(b.cx+rnd(-8,8),b.cz+rnd(-8,8));
  // a lantern-lit path across it
  for(let i=0;i<5;i++){
    const t=(i+.5)/5;
    const x=b.cx-b.hx*.8+t*b.hx*1.6, z=b.cz+Math.sin(t*Math.PI*1.6)*b.hz*.4;
    place('LAMP',LAMP_MAT,new THREE.SphereGeometry(.26,6,5),x,3.2,z);
    lightPool(x,z,4.2,0);
  }
}

// ─── BLOCKS ──────────────────────────────────────────────────────────────────
function generateBlock(b){
  const {cx,cz,hx,hz}=b;
  addPavement(cx,cz,hx,hz);

  if(b.kind==='plaza'){ plazaBlock(b); addStreetProps(cx,cz,hx,hz); return; }
  if(b.kind==='landmark'){ landmarkBlock(b); addStreetProps(cx,cz,hx,hz); return; }
  if(b.kind==='museum'){ museumBlock(b); addStreetProps(cx,cz,hx,hz); return; }
  if(b.kind==='park'){ parkBlock(b); addStreetProps(cx,cz,hx,hz); return; }

  shopRow(cx,cz,hx,hz);

  // Downtown grows tall, the outskirts stay low
  const dc=Math.min(1,Math.hypot(cx,cz)/HALF);
  const scale=1.45-dc*1.0;

  const BW=(hx-BUILD_IN)*2, BD=(hz-BUILD_IN)*2;
  const lots=[],alleys=[];
  splitLots(cx,cz,BW,BD,2+Math.floor(Math.random()*3),lots,alleys);
  alleys.forEach(dressAlley);
  const made=[];

  lots.forEach(l=>{
    if(l.w<MIN_LOT*1.15&&l.d<MIN_LOT*1.15&&Math.random()<.22){ vacantLot(l); return; }
    const bw=Math.max(8,l.w-rnd(1.2,4.5));
    const bd=Math.max(8,l.d-rnd(1.2,4.5));
    const ox=rnd(-1,1)*Math.max(0,(l.w-bw)/2), oz=rnd(-1,1)*Math.max(0,(l.d-bd)/2);
    const lotFrac=Math.min(1,(l.w*l.d)/(BW*BD*.55));
    let bh=(9+Math.pow(Math.random(),1.7)*200*(.35+.65*lotFrac))*scale;
    if(Math.random()<.04)bh*=1.9;
    bh=Math.max(9,bh);
    let style;
    if(bh<40)      style=pick(['stack','ring','podium','setback']);
    else if(bh<110)style=pick(['stack','setback','podium','core','taper']);
    else           style=pick(['setback','taper','core','podium','stack']);
    if(Math.min(bw,bd)<26&&style==='ring')style='stack';
    if(Math.min(bw,bd)<20&&style==='core')style='stack';
    addSolid(l.x+ox,l.z+oz,bw,bd);
    made.push(addBuilding(l.x+ox,l.z+oz,bw,bd,bh,style));
  });

  // Skybridge between two towers in the same block
  if(made.length>1&&Math.random()<.55){
    const a=made[0],b2=made[1];
    const y=Math.min(a.h,b2.h)*rnd(.4,.8);
    if(y>14){
      const dx=b2.x-a.x,dz=b2.z-a.z,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
      const ci=Math.floor(Math.random()*CONC_MATS.length);
      addBox('C'+ci,CONC_MATS[ci],3.6,3.4,len,(a.x+b2.x)/2,y,(a.z+b2.z)/2,ang);
      const si=Math.floor(Math.random()*STRIP_MATS.length);
      addBox('S'+si,STRIP_MATS[si],.8,.3,len*.98,(a.x+b2.x)/2,y+1.8,(a.z+b2.z)/2,ang);
    }
  }

  addStreetProps(cx,cz,hx,hz);
  // lamps on the kerb, arm out over the road
  streetLamp(cx-hx-FURN_OUT,cz+rnd(-.4,.4)*hz,-1);
  streetLamp(cx+hx+FURN_OUT,cz+rnd(-.4,.4)*hz,1);
  if(Math.random()<.6)streetLamp(cx+rnd(-.4,.4)*hx,cz-hz-FURN_OUT,-1);
}

function addOuterCity(){
  const inner=HALF+ROAD, outer=900;
  for(let i=0;i<340;i++){
    const a=Math.random()*Math.PI*2;
    const r=inner+Math.pow(Math.random(),.7)*(outer-inner);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(Math.abs(x)<HALF&&Math.abs(z)<HALF)continue;   // never inside the grid
    const fade=1-(r-inner)/(outer-inner);
    const w=rnd(30,80), d=rnd(30,80);
    const h=rnd(18,90)*(.5+fade*1.1);
    const fi=Math.floor(Math.random()*FACADES.length);
    const ti=Math.floor(Math.random()*BTINTS.length);
    const F=FACADES[fi];
    place('F'+fi+'_'+ti,facadeMat(fi,ti),
      uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F.wu,F.hu),x,h/2,z);
    if(Math.random()<.35){                            // a smaller stacked cap
      const w2=w*rnd(.4,.7), d2=d*rnd(.4,.7), h2=h*rnd(.25,.6);
      place('F'+fi+'_'+ti,facadeMat(fi,ti),
        uvBox(new THREE.BoxGeometry(w2,h2,d2),w2,h2,d2,F.wu,F.hu),
        x+rnd(-.2,.2)*w,h+h2/2,z+rnd(-.2,.2)*d);
    }
    if(h>60&&Math.random()<.3)
      place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.3,.6,rnd(8,20),6),x,h+8,z);
  }
}

// ─── ELEVATED SKYWAYS + TRANSIT PODS ─────────────────────────────────────────
const pods=[];
function addSkyways(){
  const lines=[];
  for(let i=0;i<3;i++){
    // follow an actual road from the plan rather than an assumed grid line
    const horiz=i%2===0;
    const src=horiz?PLAN.zs:PLAN.xs;
    const pick2=src.filter(r=>r.type!==R_PED);
    if(!pick2.length)continue;
    const p=pick2[Math.floor(Math.random()*pick2.length)].base;
    const y=38+Math.random()*26;
    lines.push({horiz,p,y});

    const ci=2;
    if(horiz)addBox('C'+ci,CONC_MATS[ci],CITY,2.2,7,0,y,p);
    else     addBox('C'+ci,CONC_MATS[ci],7,2.2,CITY,p,y,0);
    const si=Math.floor(Math.random()*STRIP_MATS.length);
    [-3.1,3.1].forEach(o=>{                      // guide rails
      if(horiz)addBox('S'+si,STRIP_MATS[si],CITY,.18,.25,0,y+1.2,p+o);
      else     addBox('S'+si,STRIP_MATS[si],.25,.18,CITY,p+o,y+1.2,0);
    });
    for(let k=0;k<9;k++){                        // pylons
      const s=-HALF+(k+.5)*CITY/9;
      const px=horiz?s:p, pz=horiz?p:s;
      place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(1.6,2.6,y,8),px,y/2,pz);
      addBox('C'+ci,CONC_MATS[ci],horiz?5:13,1.8,horiz?13:5,px,y-1.6,pz);
    }
  }

  // Transit pods gliding along the lines
  const podBody=new THREE.CapsuleGeometry(1.6,9,4,8);
  const podMat=new THREE.MeshStandardMaterial({color:0x2a3448,metalness:.75,roughness:.3});
  const podGlow=new THREE.MeshBasicMaterial({color:0x00c8e0});
  lines.forEach(l=>{
    for(let n=0;n<2;n++){
      const g=new THREE.Group();
      const b=new THREE.Mesh(podBody,podMat); b.rotation.x=Math.PI/2; g.add(b);
      const s=new THREE.Mesh(new THREE.BoxGeometry(2.4,.4,9),podGlow);
      s.position.y=-1.2; g.add(s);
      const dir=Math.random()>.5?1:-1, off=dir*3.1;
      if(l.horiz)g.position.set(rnd(-HALF,HALF),l.y+3.2,l.p+off);
      else{g.position.set(l.p+off,l.y+3.2,rnd(-HALF,HALF)); g.rotation.y=Math.PI/2;}
      g.userData={axis:l.horiz?'x':'z',spd:rnd(55,85)*dir};
      scene.add(g); pods.push(g);
    }
  });
}

// ─── NPC CARS ─────────────────────────────────────────────────────────────────
const cars=[];

// Shared car materials — created once, reused across all cars
// ─── VEHICLES ────────────────────────────────────────────────────────────────
// Each car used to be a Group of six meshes — 240 draw calls for forty cars,
// and the silhouette was a box on a box. Parts are now merged into two
// geometries per car (paint and lights), so a far more detailed vehicle costs
// two calls instead of six, and colour rides in vertex data on a shared
// material rather than one material per body colour.
const CAR_PAINT=[0x9fb2c8,0x2b3442,0xb9c2c9,0x6d2f34,0x2f4a6d,0xd8d8d2,
                 0x3a5a45,0x8a8f96,0x1f2530,0xc7a34a];
const CAR_BODY_MAT=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.38,metalness:.55,envMapIntensity:1.1});
const CAR_LIGHT_MAT=new THREE.MeshBasicMaterial({vertexColors:true});
const FLY_HL_MAT=new THREE.MeshBasicMaterial({color:0xfff2d0});   // flying cars keep a plain lamp

function tintGeo(g,hex){
  const c=new THREE.Color(hex);
  const n=g.attributes.position.count;
  const arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(arr,3));
  return g;
}
function boxAt(w,h,d,x,y,z,hex,ry){
  const g=new THREE.BoxGeometry(w,h,d);
  if(ry)g.rotateY(ry);
  g.translate(x,y,z);
  return tintGeo(g,hex);
}
function wheelAt(r,x,y,z){
  const g=new THREE.CylinderGeometry(r,r,.24,10);
  g.rotateZ(Math.PI/2); g.translate(x,y,z);
  return tintGeo(g,0x121418);
}

// type: 0 saloon, 1 kei van, 2 kei truck, 3 taxi
function buildCar(type,paint){
  const body=[],lights=[];
  const glass=0x121c26;
  if(type===1){                                   // tall boxy kei van
    body.push(boxAt(3.2,2.5,6.4,0,1.35,0,paint));
    body.push(boxAt(3.24,1.15,3.4,0,1.95,.6,glass));
    body.push(boxAt(3.3,.35,6.5,0,.35,0,0x20242c));
    body.push(wheelAt(.5,-1.6,.5,2.0),wheelAt(.5,1.6,.5,2.0),
              wheelAt(.5,-1.6,.5,-2.1),wheelAt(.5,1.6,.5,-2.1));
    lights.push(boxAt(.7,.3,.16,-1.1,1.0,3.24,0xfff2d0),
                boxAt(.7,.3,.16,1.1,1.0,3.24,0xfff2d0),
                boxAt(.6,.3,.16,-1.1,1.3,-3.24,0xff2a12),
                boxAt(.6,.3,.16,1.1,1.3,-3.24,0xff2a12));
  }else if(type===2){                             // kei truck with a flat bed
    body.push(boxAt(3.0,1.9,2.6,0,1.15,1.7,paint));
    body.push(boxAt(3.04,.95,2.2,0,1.6,1.9,glass));
    body.push(boxAt(3.0,.55,4.0,0,.75,-1.2,paint));
    body.push(boxAt(3.0,.7,.18,0,1.15,-3.15,paint));
    body.push(wheelAt(.46,-1.5,.46,2.0),wheelAt(.46,1.5,.46,2.0),
              wheelAt(.46,-1.5,.46,-2.2),wheelAt(.46,1.5,.46,-2.2));
    lights.push(boxAt(.55,.28,.16,-1.0,.95,3.04,0xfff2d0),
                boxAt(.55,.28,.16,1.0,.95,3.04,0xfff2d0),
                boxAt(.5,.26,.16,-1.2,1.1,-3.3,0xff2a12),
                boxAt(.5,.26,.16,1.2,1.1,-3.3,0xff2a12));
  }else{                                          // saloon, and the taxi variant
    body.push(boxAt(3.3,1.05,7.0,0,.85,0,paint));
    body.push(boxAt(3.0,.85,3.6,0,1.62,-.35,paint));
    body.push(boxAt(3.04,.62,3.3,0,1.68,-.3,glass));
    body.push(boxAt(3.36,.3,6.6,0,.42,0,0x1a1e24));
    body.push(wheelAt(.48,-1.65,.48,2.3),wheelAt(.48,1.65,.48,2.3),
              wheelAt(.48,-1.65,.48,-2.3),wheelAt(.48,1.65,.48,-2.3));
    lights.push(boxAt(.85,.26,.16,-1.05,.95,3.52,0xfff2d0),
                boxAt(.85,.26,.16,1.05,.95,3.52,0xfff2d0),
                boxAt(.75,.24,.16,-1.05,1.0,-3.52,0xff2a12),
                boxAt(.75,.24,.16,1.05,1.0,-3.52,0xff2a12));
    if(type===3){                                 // lit roof sign
      body.push(boxAt(.9,.16,.5,0,2.06,-.3,0x2a2f38));
      lights.push(boxAt(.86,.34,.44,0,2.28,-.3,0xffd45a));
    }
  }
  // a little light spilling onto the road under the sills
  lights.push(boxAt(2.4,.06,5.2,0,.16,0,type===3?0xffb040:0x2f6fa8));
  return {body:mergeGeometries(body,false),lights:mergeGeometries(lights,false)};
}

// Cars follow the plan's polylines, so they take the jogs with the road and
// never appear on a pedestrian street. One-way roads carry traffic in a single
// direction; two-way roads put each direction on its own side of the centre line.
function placeCarOnPath(g,fresh){
  const path=pick(PLAN.carPaths);
  const dir=path.oneway?(path.oneway>0?1:-1):(Math.random()<.5?1:-1);
  const lane=(path.oneway? rnd(-1,1)*(path.w/2-2.4)
                         : dir*rnd(1.6,Math.max(1.7,path.w/2-2.0)));
  g.userData={path,seg:fresh?Math.floor(Math.random()*(path.pts.length-1)):(dir>0?0:path.pts.length-2),
              t:fresh?Math.random():(dir>0?0:1),
              dir,lane,spd:15+Math.random()*24};
}
function spawnCars(){
  for(let i=0;i<44;i++){
    const taxi=Math.random()<.18;
    const type=taxi?3:(Math.random()<.28?1:(Math.random()<.22?2:0));
    const paint=taxi?0xf0c94a:pick(CAR_PAINT);
    const parts=buildCar(type,paint);
    const g=new THREE.Group();
    g.add(new THREE.Mesh(parts.body,CAR_BODY_MAT));
    g.add(new THREE.Mesh(parts.lights,CAR_LIGHT_MAT));
    placeCarOnPath(g,true);
    scene.add(g); cars.push(g);
  }
}
function driveCars(dt){
  for(let n=0;n<cars.length;n++){
    const c=cars[n],u=c.userData,P2=u.path.pts;
    let a=P2[u.seg],b=P2[u.seg+1];
    if(!a||!b){ placeCarOnPath(c,true); continue; }
    let len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(len<0.001){ u.seg+=u.dir; if(u.seg<0||u.seg>=P2.length-1)placeCarOnPath(c,true); continue; }
    u.t+=u.dir*u.spd*dt/len;
    while(u.t>1){ u.seg++; if(u.seg>=P2.length-1){placeCarOnPath(c,true);break;} u.t-=1;
      a=P2[u.seg];b=P2[u.seg+1];len=Math.max(.001,Math.hypot(b[0]-a[0],b[1]-a[1])); }
    while(u.t<0){ u.seg--; if(u.seg<0){placeCarOnPath(c,true);break;} u.t+=1;
      a=P2[u.seg];b=P2[u.seg+1];len=Math.max(.001,Math.hypot(b[0]-a[0],b[1]-a[1])); }
    const aa=u.path.pts[u.seg],bb=u.path.pts[u.seg+1];
    if(!aa||!bb)continue;
    const dx=(bb[0]-aa[0]), dz=(bb[1]-aa[1]);
    const L=Math.max(.001,Math.hypot(dx,dz));
    const hx=dx/L, hz=dz/L;
    // lane offset is perpendicular to travel
    const px=aa[0]+dx*u.t - hz*u.lane;
    const pz=aa[1]+dz*u.t + hx*u.lane;
    c.position.set(px,0,pz);
    c.rotation.y=Math.atan2(hx*u.dir,hz*u.dir);
  }
}

// ─── PEDESTRIANS ─────────────────────────────────────────────────────────────
// The city had no people in it, which is most of why it read as a model rather
// than a place. These are instanced — five draw calls for the whole crowd — and
// recycled around the player, so density stays high wherever you actually are
// instead of being spread thin over a hundred blocks you cannot see.
const PED_N=300;
const PED_WALK=(WALK_A+WALK_B)/2;  // offset from a block edge: the reserved lane
const peds=[];
let pedTorso,pedHead,pedLegL,pedLegR,pedPhone;
const _pd=new THREE.Object3D();
_pd.rotation.order='YXZ';         // so rotation.set(swing,heading,0) gives Ry*Rx

const COAT_COLS=[0x1b1d24,0x2a2f3a,0x3a2b2b,0x14181e,0x4a4038,0x232a33,
                 0x5a2733,0x1e3340,0x40384a,0x6a6258,0xb03a3a,0x2f5a4a];
const SKIN_COLS=[0xe8c9a8,0xd9b48c,0xc9975f,0xa87248,0x8a5a3a,0xf0d8bc];

// Position and heading at distance t around a block's pavement loop
// Walk the perimeter of a rectangular block at the reserved-lane offset
function pedLoop(t,rx,rz){
  const px=rx*2,pz=rz*2,per=2*(px+pz);
  let u=((t%per)+per)%per;
  if(u<px)          return [u-rx,-rz,Math.PI/2];   // heading: forward=(sin h,cos h)
  u-=px;
  if(u<pz)          return [rx,u-rz,0];
  u-=pz;
  if(u<px)          return [rx-u,rz,-Math.PI/2];
  u-=px;
  return [-rx,rz-u,Math.PI];
}

function buildPedestrians(){
  const torsoGeo=new THREE.CapsuleGeometry(.19,.46,3,6);
  const headGeo=new THREE.SphereGeometry(.15,7,6);
  const legGeo=new THREE.BoxGeometry(.14,.72,.17);
  const phoneGeo=new THREE.PlaneGeometry(.13,.19);
  const bodyMat=new THREE.MeshStandardMaterial({roughness:.88,metalness:.03});
  const headMat=new THREE.MeshStandardMaterial({roughness:.75,metalness:.02});
  const legMat=new THREE.MeshStandardMaterial({color:0x15171d,roughness:.9,metalness:.02});
  const phoneMat=new THREE.MeshBasicMaterial({color:0xbfe4ff,side:THREE.DoubleSide});

  pedTorso=new THREE.InstancedMesh(torsoGeo,bodyMat,PED_N);
  pedHead =new THREE.InstancedMesh(headGeo,headMat,PED_N);
  pedLegL =new THREE.InstancedMesh(legGeo,legMat,PED_N);
  pedLegR =new THREE.InstancedMesh(legGeo,legMat,PED_N);
  pedPhone=new THREE.InstancedMesh(phoneGeo,phoneMat,PED_N);
  [pedTorso,pedHead,pedLegL,pedLegR,pedPhone].forEach(m=>{
    m.frustumCulled=false;
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(m);
  });

  const c=new THREE.Color();
  for(let i=0;i<PED_N;i++){
    peds.push({
      cx:0,cz:0,                       // block centre this one is walking round
      t:0,dir:1,spd:rnd(1.0,1.9),
      phase:Math.random()*Math.PI*2,
      idle:Math.random()<.14,          // some just stand outside a shop
      rx:40,rz:40,
      phone:Math.random()<.28,
      h:rnd(.92,1.06)                  // height scale
    });
    pedTorso.setColorAt(i,c.setHex(pick(COAT_COLS)));
    pedHead.setColorAt(i,c.setHex(pick(SKIN_COLS)));
    respawnPed(i,true);
  }
  pedTorso.instanceColor.needsUpdate=true;
  pedHead.instanceColor.needsUpdate=true;
}

// Drop a pedestrian onto a block near the player
function respawnPed(i,anywhere){
  const p=peds[i];
  const B=PLAN.blocks;
  if(!B.length)return;
  let b;
  if(anywhere)b=B[Math.floor(Math.random()*B.length)];
  else{
    // pick a block near the player, so the crowd stays where it can be seen
    let best=null,bd=1e9;
    for(let k=0;k<24;k++){
      const c=B[Math.floor(Math.random()*B.length)];
      const d=Math.hypot(c.cx-P.pos.x,c.cz-P.pos.z);
      if(d<bd&&d>18){bd=d;best=c;}
    }
    b=best||B[Math.floor(Math.random()*B.length)];
  }
  p.cx=b.cx; p.cz=b.cz;
  p.rx=b.hx+PED_WALK; p.rz=b.hz+PED_WALK;
  p.t=Math.random()*2*(p.rx*2+p.rz*2);
  p.dir=Math.random()<.5?-1:1;
  p.idle=Math.random()<.14;
}

function updatePedestrians(dt,time){
  if(!pedTorso)return;
  for(let i=0;i<PED_N;i++){
    const p=peds[i];
    if(!p.idle) p.t+=p.spd*p.dir*dt;
    const loop=2*(p.rx*2+p.rz*2);
    p.t=(p.t%loop+loop)%loop;
    let [lx,lz,head]=pedLoop(p.t,p.rx,p.rz);
    let x=p.cx+lx, z=p.cz+lz;

    // recycle anyone the player has left far behind, then place them the same
    // frame — skipping the write would leave the instance at the world origin
    const dx=x-P.pos.x, dz=z-P.pos.z;
    if(dx*dx+dz*dz>235*235){
      respawnPed(i,false);
      [lx,lz,head]=pedLoop(p.t,p.rx,p.rz);
      x=p.cx+lx; z=p.cz+lz;
    }
    const heading=head+(p.dir<0?Math.PI:0);

    const step=p.idle?0:Math.sin(time*p.spd*3.4+p.phase);
    const bob=p.idle?0:Math.abs(Math.cos(time*p.spd*3.4+p.phase))*.035;
    const s=p.h;

    _pd.position.set(x,(1.02+bob)*s,z);
    _pd.rotation.set(0,heading,0);
    _pd.scale.setScalar(s);
    _pd.updateMatrix(); pedTorso.setMatrixAt(i,_pd.matrix);

    _pd.position.set(x,(1.52+bob)*s,z);
    _pd.updateMatrix(); pedHead.setMatrixAt(i,_pd.matrix);

    // legs swing about the hip: local offset rotated by Rx(swing) then Ry(heading)
    const sw=step*.42, cs=Math.cos(sw), sn=Math.sin(sw);
    const ch=Math.cos(heading), sh=Math.sin(heading);
    for(let L=0;L<2;L++){
      const ox=(L?.115:-.115)*s, sg=L?1:-1;
      const ly=-.36*Math.cos(sg*sw)*s, lz2=-.36*Math.sin(sg*sw)*s;
      _pd.position.set(x+ox*ch+lz2*sh,(.78+bob)*s+ly,z-ox*sh+lz2*ch);
      _pd.rotation.set(sg*sw,heading,0);
      _pd.scale.setScalar(s);
      _pd.updateMatrix();
      (L?pedLegR:pedLegL).setMatrixAt(i,_pd.matrix);
    }

    // a lit phone screen, the most reliable sign of life on a night street
    if(p.phone){
      _pd.position.set(x+Math.sin(heading)*.28,(1.16+bob)*s,z+Math.cos(heading)*.28);
      _pd.rotation.set(-.9,heading,0);
      _pd.scale.setScalar(s);
    }else{
      _pd.position.set(0,-50,0); _pd.rotation.set(0,0,0); _pd.scale.setScalar(.001);
    }
    _pd.updateMatrix(); pedPhone.setMatrixAt(i,_pd.matrix);
  }
  pedTorso.instanceMatrix.needsUpdate=true;
  pedHead.instanceMatrix.needsUpdate=true;
  pedLegL.instanceMatrix.needsUpdate=true;
  pedLegR.instanceMatrix.needsUpdate=true;
  pedPhone.instanceMatrix.needsUpdate=true;
}

// ─── PLAYER ──────────────────────────────────────────────────────────────────
const P={
  pos:new THREE.Vector3(0,2.5,0),   // moved onto a real road once the plan exists
  yaw:0, pitch:0,
  mode:'foot',
  spd:0
};
camera.position.copy(P.pos);
camera.rotation.order='YXZ';

const SPEEDS={foot:14,car:55,fly:75};
const HEIGHTS={foot:1.7,car:2.2};

// ─── INPUT ───────────────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(e.code==='Digit1')setMode('foot');
  if(e.code==='Digit2')setMode('car');
  if(e.code==='Digit3')setMode('fly');
});
document.addEventListener('keyup',e=>{K[e.code]=false});

const IS_TOUCH='ontouchstart' in window||navigator.maxTouchPoints>0;
let mdx=0,mdy=0,locked=false;
canvas.addEventListener('click',()=>{if(!IS_TOUCH)canvas.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas});
document.addEventListener('mousemove',e=>{if(locked){mdx+=e.movementX;mdy+=e.movementY}});

// Joystick state
const JS={L:{on:false,dx:0,dy:0},R:{on:false,dx:0,dy:0}};
function setupStick(el,knob,side){
  const R=46;
  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    JS[side]={on:true,sx:t.clientX,sy:t.clientY,dx:0,dy:0};
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    const s=JS[side]; if(!s.on)return;
    const t=e.changedTouches[0];
    let dx=t.clientX-s.sx, dy=t.clientY-s.sy;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len>R){dx=dx/len*R;dy=dy/len*R;}
    s.dx=dx/R; s.dy=dy/R;
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  },{passive:false});
  const end=e=>{
    e.preventDefault();
    JS[side].on=false; JS[side].dx=0; JS[side].dy=0;
    knob.style.transform='translate(-50%,-50%)';
  };
  el.addEventListener('touchend',end,{passive:false});
  el.addEventListener('touchcancel',end,{passive:false});
}
setupStick(document.getElementById('lj'),document.getElementById('lk'),'L');
setupStick(document.getElementById('rj'),document.getElementById('rk'),'R');

let vInput=0;
const upb=document.getElementById('upb'), dnb=document.getElementById('dnb');
upb.addEventListener('touchstart',e=>{e.preventDefault();vInput=1},{passive:false});
upb.addEventListener('touchend',e=>{e.preventDefault();vInput=0},{passive:false});
dnb.addEventListener('touchstart',e=>{e.preventDefault();vInput=-1},{passive:false});
dnb.addEventListener('touchend',e=>{e.preventDefault();vInput=0},{passive:false});
upb.addEventListener('mousedown',()=>vInput=1); upb.addEventListener('mouseup',()=>vInput=0);
dnb.addEventListener('mousedown',()=>vInput=-1); dnb.addEventListener('mouseup',()=>vInput=0);

document.querySelectorAll('.mb').forEach(b=>{
  b.addEventListener('click',()=>setMode(b.dataset.m));
  b.addEventListener('touchend',e=>{e.preventDefault();setMode(b.dataset.m)});
});

function setMode(m){
  P.mode=m;
  document.getElementById('mode-disp').textContent=m.toUpperCase();
  document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m!=='fly'){ P.pos.y=HEIGHTS[m]; P.pitch=0; }
}

// ─── MINIMAP ─────────────────────────────────────────────────────────────────
const mmc=document.getElementById('map-c');
const mmx=mmc.getContext('2d');
function drawMap(){
  const S=110;
  mmx.fillStyle='#03070f'; mmx.fillRect(0,0,S,S);
  // the real road network, jogs and all; pedestrian streets in a warmer tone
  const M=v=>(v+HALF)/CITY*S;
  PLAN.carPaths.forEach(pt=>{
    mmx.strokeStyle=pt.oneway?'#1d3a4d':'#16283c';
    mmx.lineWidth=pt.oneway?1:1.6;
    mmx.beginPath();
    pt.pts.forEach((q,k)=>k?mmx.lineTo(M(q[0]),M(q[1])):mmx.moveTo(M(q[0]),M(q[1])));
    mmx.stroke();
  });
  mmx.strokeStyle='#4a3a1e'; mmx.lineWidth=1.2;
  PLAN.pedWays.forEach(pw=>{
    const r=pw.r;
    mmx.beginPath();
    r.off.forEach((v,k)=>{
      const t=M(-HALF+k*CITY/Math.max(1,r.off.length-1)), o=M(v);
      const x=pw.axis==='x'?o:t, z=pw.axis==='x'?t:o;
      k?mmx.lineTo(x,z):mmx.moveTo(x,z);
    });
    mmx.stroke();
  });
  PLAN.blocks.forEach(b=>{
    if(b.kind==='city')return;
    mmx.fillStyle=b.kind==='landmark'?'#8a2f4a':b.kind==='park'?'#1e3a24':
                  b.kind==='plaza'?'#2f3a5a':'#4a3f2a';
    mmx.fillRect(M(b.cx-b.hx),M(b.cz-b.hz),b.hx*2/CITY*S,b.hz*2/CITY*S);
  });
  // Cars
  mmx.fillStyle='#334466';
  cars.forEach(c=>{
    const mx=(c.position.x+HALF)/CITY*S, mz=(c.position.z+HALF)/CITY*S;
    mmx.fillRect(mx-1,mz-1,2,2);
  });
  // Drones
  mmx.fillStyle='#004422';
  drones.forEach(d=>{
    const mx=(d.position.x+HALF)/CITY*S, mz=(d.position.z+HALF)/CITY*S;
    mmx.fillRect(mx-1,mz-1,2,2);
  });
  // Player
  const px=(P.pos.x+HALF)/CITY*S, pz=(P.pos.z+HALF)/CITY*S;
  mmx.fillStyle='#00ffff';
  mmx.beginPath(); mmx.arc(px,pz,3,0,Math.PI*2); mmx.fill();
  mmx.strokeStyle='#00ffff'; mmx.lineWidth=1;
  mmx.beginPath(); mmx.moveTo(px,pz);
  mmx.lineTo(px+Math.sin(P.yaw)*9, pz+Math.cos(P.yaw)*9); mmx.stroke();
}

// ─── UPDATE PLAYER ────────────────────────────────────────────────────────────
function updatePlayer(dt){
  // Look
  const MSENS=.0018, TSENS=2.2;
  if(locked){ P.yaw-=mdx*MSENS; P.pitch-=mdy*MSENS; }
  if(JS.R.on){ P.yaw-=JS.R.dx*TSENS*dt; P.pitch-=JS.R.dy*TSENS*dt; }
  mdx=0; mdy=0;
  P.pitch=Math.max(-Math.PI/2.1,Math.min(Math.PI/2.1,P.pitch));

  // Move inputs
  let fwd=0,str=0,vrt=0;
  if(K.KeyW||K.ArrowUp)fwd=1;
  if(K.KeyS||K.ArrowDown)fwd=-1;
  if(K.KeyD||K.ArrowRight)str=1;
  if(K.KeyA||K.ArrowLeft)str=-1;
  if(K.Space||K.KeyE)vrt=1;
  if(K.ShiftLeft||K.KeyQ)vrt=-1;
  if(JS.L.on){ fwd=-JS.L.dy; str=JS.L.dx; }
  vrt+=vInput;

  const spd=SPEEDS[P.mode];
  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);

  if(P.mode==='fly'){
    // 3D flight: forward follows pitch
    const fsin=Math.sin(P.pitch), fcos=Math.cos(P.pitch);
    const wx=fwd*(-sin*fcos)+str*cos;
    const wy=fwd*fsin;
    const wz=fwd*(-cos*fcos)+str*(-sin);
    P.pos.x+=wx*spd*dt;
    P.pos.y+=wy*spd*dt+vrt*spd*.5*dt;
    P.pos.z+=wz*spd*dt;
    P.pos.y=Math.max(5,P.pos.y);
  } else {
    // Ground — solid. Fly mode deliberately keeps no-clip.
    const wx=fwd*(-sin)+str*cos;
    const wz=fwd*(-cos)+str*(-sin);
    const r=P.mode==='car'?1.7:0.42;
    const [mx,mz]=moveSolid(P.pos.x,P.pos.z,
                            P.pos.x+wx*spd*dt,P.pos.z+wz*spd*dt,r);
    P.pos.x=mx; P.pos.z=mz;
    P.pos.y=HEIGHTS[P.mode];
  }

  // Wrap city bounds
  if(P.pos.x> HALF)P.pos.x=-HALF;
  if(P.pos.x<-HALF)P.pos.x= HALF;
  if(P.pos.z> HALF)P.pos.z=-HALF;
  if(P.pos.z<-HALF)P.pos.z= HALF;

  // Speed display
  const len2d=Math.sqrt(
    (P.pos.x-camera.position.x)**2+(P.pos.z-camera.position.z)**2
  );
  P.spd=len2d/dt*3.6;

  camera.position.copy(P.pos);
  camera.rotation.y=P.yaw;
  camera.rotation.x=P.pitch;
}

// ─── UPDATE NPCS ──────────────────────────────────────────────────────────────
function updateNPCs(dt,t){
  driveCars(dt);

  flyingCars.forEach(c=>{
    c.position[c.userData.axis]+=c.userData.spd*dt;
    if(c.position[c.userData.axis]>HALF)c.position[c.userData.axis]=-HALF;
    if(c.position[c.userData.axis]<-HALF)c.position[c.userData.axis]=HALF;
  });

  pods.forEach(p=>{
    p.position[p.userData.axis]+=p.userData.spd*dt;
    if(p.position[p.userData.axis]>HALF)p.position[p.userData.axis]=-HALF;
    if(p.position[p.userData.axis]<-HALF)p.position[p.userData.axis]=HALF;
  });

  drones.forEach(d=>{
    const u=d.userData;
    u.ang+=u.spd*dt*.022;
    d.position.x=u.cx+Math.cos(u.ang)*u.rad;
    d.position.z=u.cz+Math.sin(u.ang)*u.rad;
    d.position.y=u.by+Math.sin(t*u.bspd)*u.bamp;
    d.rotation.y=u.ang+Math.PI/2;
    d.children.forEach(ch=>{if(ch.userData.rotor)ch.rotation.y+=8*dt;});
  });

  holoMeshes.forEach(h=>{
    h.rotation.x+=h.userData.rx*dt;
    h.rotation.y+=h.userData.ry*dt;
    h.rotation.z+=h.userData.rz*dt;
  });
}

// ─── UPDATE RAIN ──────────────────────────────────────────────────────────────
function updateRain(dt){
  if(!rain)return;
  const p=rain.geometry.attributes.position.array;
  const N=p.length/3;
  for(let i=0;i<N;i++){
    p[i*3+1]-=55*dt;
    if(p[i*3+1]<0){
      p[i*3]=P.pos.x+rnd(-250,250);
      p[i*3+1]=P.pos.y+rnd(150,260);
      p[i*3+2]=P.pos.z+rnd(-250,250);
    }
  }
  rain.geometry.attributes.position.needsUpdate=true;
}

// ─── ANIMATE SCENE ELEMENTS ───────────────────────────────────────────────────
function updateAnim(t,dt){
  // Sky follows the player on X/Z so the horizon stays at infinity
  skyGroup.position.set(camera.position.x,0,camera.position.z);
  domeGroup.position.copy(camera.position);
  skyUniforms.uTime.value=t;
  cloudGroup.rotation.y+=dt*0.004;
  // Neon sign pulse
  neonMeshes.forEach(m=>{
    const v=.85+.15*Math.sin(t*1.8+m.userData.phase);
    m.material.opacity=v;
  });
  // Shop signage: a few dozen shared materials rather than ~1800 meshes
  for(let i=0;i<SIGN_ANIM.length;i++){
    const m=SIGN_ANIM[i];
    m.opacity=.88+.12*Math.sin(t*1.6+m.userData.phase);
  }
  // Antenna blinks
  blinkLights.forEach(b=>{
    const on=Math.sin(t*b.userData.rate*Math.PI*2+b.userData.phase)>.5;
    b.material.color.setHex(on?0xff2200:0x220000);
  });
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
const spdEl=document.getElementById('spd');
function updateHUD(){
  spdEl.innerHTML=`${Math.round(P.spd)}<small>KM/H</small>`;
}

window.addEventListener('resize',()=>{
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
  composer.setSize(W(),H());

// ─── LOADING ─────────────────────────────────────────────────────────────────
function setLoad(pct,txt){
  document.getElementById('lbar').style.width=pct+'%';
  document.getElementById('ltxt').textContent=txt;
}
const tick=ms=>new Promise(r=>setTimeout(r,ms));

async function init(){
  try{
    setLoad(8,'INITIALIZING RENDERER...');  await tick(40);
    for(let i=0;i<FACADE_KINDS.length;i++){
      FACADES.push(facadeTex(FACADE_KINDS[i]));
      setLoad(8+i,'WEAVING FACADES...'); await tick(0);
    }
    setLoad(18,'CALIBRATING HORIZON...');    await tick(30);
    buildEnvMap();
    setLoad(24,'PREFILTERING REFLECTIONS...'); await tick(20);
    buildPlan();
    // stand the player on a road junction from the plan, never inside a block
    (()=>{
      const xr=PLAN.xs.find(r=>r.type!==R_PED)||PLAN.xs[0];
      const zr=PLAN.zs.find(r=>r.type!==R_PED)||PLAN.zs[0];
      if(xr&&zr){
        const j=Math.min(xr.off.length-1,Math.floor(PLAN.zs.length/2));
        const i=Math.min(zr.off.length-1,Math.floor(PLAN.xs.length/2));
        P.pos.set(xr.off[j],P.pos.y,zr.off[i]);
      }
    })();
    initAdVideo();
    buildSignPools();
    setLoad(30,'CONSTRUCTING CITY...');
    for(let bi=0;bi<PLAN.blocks.length;bi++){
      generateBlock(PLAN.blocks[bi]);
      const gx=Math.floor(bi/Math.max(1,Math.round(Math.sqrt(PLAN.blocks.length))));
      if(gx%3===0){setLoad(30+gx*4,'CONSTRUCTING CITY...'); await tick(10);}
    }
    layRoads();
    addCampaign();
    setLoad(62,'EXTENDING SPRAWL...');       await tick(20);
    addOuterCity();
    setLoad(66,'RAISING SKYWAYS...');        await tick(20);
    addSkyways();
    setLoad(70,'WELDING STRUCTURES...');     await tick(30);
    flushBuckets(); await tick(20);
    setLoad(76,'SPAWNING TRAFFIC...');       await tick(30);
    spawnCars(); await tick(20);
    spawnFlyingCars();
    setLoad(82,'LAUNCHING DRONES...');       await tick(30);
    spawnDrones();
    setLoad(88,'SPAWNING HOLOGRAMS...');     await tick(20);
    spawnHolograms();
    setLoad(90,'RELEASING CROWDS...');      await tick(20);
    buildPedestrians();
    setLoad(93,'STARTING WEATHER...');       await tick(20);
    createRain();
    setLoad(100,'MEGACITY ONLINE');          await tick(400);
    document.getElementById('enter-btn').style.display='block';
  }catch(e){
    console.error('Init failed:',e);
    document.getElementById('ltxt').textContent='ERROR: '+e.message;
    document.getElementById('ltxt').style.color='#ff4444';
  }
}

document.getElementById('enter-btn').addEventListener('click',startGame);
document.getElementById('enter-btn').addEventListener('touchend',e=>{e.preventDefault();startGame();});

function startGame(){
  startAdVideo();
  document.getElementById('load').style.transition='opacity .6s';
  document.getElementById('load').style.opacity='0';
  setTimeout(()=>document.getElementById('load').style.display='none',600);
  if(!IS_TOUCH)canvas.requestPointerLock();
  requestAnimationFrame(loop);
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(dt<=0)return;
  const t=now/1000;
  updatePlayer(dt);
  updateNPCs(dt,t);
  updatePedestrians(dt,t);
  updateRain(dt);
  updateAnim(t,dt);
  drawMap();
  updateHUD();
  composer.render();
}

init();
</script>
