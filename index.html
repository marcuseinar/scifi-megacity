/* Touch joysticks */

/* Mode buttons */

/* Vertical buttons for fly */

/* Scan line overlay */

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const GRID=10, BLOCK=80, ROAD=28, CELL=BLOCK+ROAD;
const CITY=GRID*CELL, HALF=CITY/2;
const NEONS=[0x00ffff,0xff00ff,0xff6600,0x00ff88,0xff0066,0xaa00ff,0xffff00];
const BCOLORS=[0x0d1830,0x0a1428,0x111a30,0x080e1f,0x141f35,0x0f1525];
const SIGNS=['NOODLES','CYBER CAFE','IMPLANTS','DATA HAVEN','SYNTH BAR','MEGACORP',
             'UPLOAD','REBOOT','NEXUS','GRIDLINK','网络城市','VOID','CHROME',
             'NEON DISTRICT','JACK IN','FLATLINE','WETWARE','NEUROLINK'];

// ─── RENDERER / SCENE / CAMERA ───────────────────────────────────────────────
const canvas=document.getElementById('c');
const W=()=>window.innerWidth, H=()=>window.innerHeight;

const renderer=new THREE.WebGLRenderer({canvas,antialias:window.devicePixelRatio<2,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled=false; // disabled for perf
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x2a1038,0.0016);

const camera=new THREE.PerspectiveCamera(72,W()/H(),0.5,1800);

// ─── POST PROCESSING ─────────────────────────────────────────────────────────
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W(),H()),0.85,0.5,0.62);
composer.addPass(bloom);

function rnd(a,b){return a+Math.random()*(b-a)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}


// ─── SCANNED MATERIAL PACKS ──────────────────────────────────────────────────
// CC0 scans from ambientCG, resized and channel-packed (see textures/CREDITS).
// Each pack loads lazily and overwrites the procedural material once it lands,
// so a blocked or missing download degrades to the generated look.
const PACKS={
  tarmac   :{dir:'textures/tarmac',    tile:14},
  concrete :{dir:'textures/concrete',  tile:6},
  rustplate:{dir:'textures/rustplate', tile:9}
};
const packLoader=new THREE.TextureLoader();
const packCache=new Map();
function packMap(name,suffix,srgb){
  const url=`${PACKS[name].dir}_${suffix}.webp`;
  let t=packCache.get(url);
  if(!t){
    t=packLoader.load(url,tx=>{tx.needsUpdate=true;},undefined,()=>{});
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    if(srgb)t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=8;
    packCache.set(url,t);
  }
  return t;
}
// Point a standard material at a pack. `tint` keeps the night palette, since
// the scans are lit for daylight and read far too bright straight out of the box.
function usePack(mat,name,{tint=0xffffff,normalScale=1,rough=1,metal=1,env=1,repeat=0}={}){
  mat.map=packMap(name,'color',true);
  mat.normalMap=packMap(name,'normal',false);
  const orm=packMap(name,'orm',false);
  mat.roughnessMap=orm; mat.metalnessMap=orm;
  if(repeat)[mat.map,mat.normalMap,orm].forEach(t=>t.repeat.set(repeat,repeat));
  mat.color.setHex(tint);
  mat.normalScale=new THREE.Vector2(normalScale,normalScale);
  mat.roughness=rough; mat.metalness=metal; mat.envMapIntensity=env;
  mat.needsUpdate=true;
  return mat;
}

// ─── DERIVED SURFACE MAPS ────────────────────────────────────────────────────
// Treat the albedo's luminance as a height field: window reveals, panel seams,
// ribs and corrugation all become real relief under the lighting.
function deriveMaps(src,strength,baseRough,baseMetal){
  // One readback, one pass, half resolution: relief and roughness are broad
  // signals, so full-res derivation would just cost load time for nothing.
  const sw=src.width,sh=src.height;
  const d=src.getContext('2d').getImageData(0,0,sw,sh).data;
  const w=Math.max(2,sw>>1),h=Math.max(2,sh>>1);
  const lum=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=((y*2)*sw+x*2)*4;
    lum[y*w+x]=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
  }
  const nc=document.createElement('canvas'); nc.width=w; nc.height=h;
  const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  const nctx=nc.getContext('2d'), octx=oc.getContext('2d');
  const nImg=nctx.createImageData(w,h), oImg=octx.createImageData(w,h);
  const L=(x,y)=>lum[((y+h)%h)*w+((x+w)%w)];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const k=(y*w+x)*4;
    // canvas y runs down, texture v runs up, so the v derivative flips sign
    const nx=-(L(x+1,y)-L(x-1,y))*strength;
    const ny= (L(x,y+1)-L(x,y-1))*strength;
    const len=Math.hypot(nx,ny,1);
    nImg.data[k]  =(nx/len*.5+.5)*255;
    nImg.data[k+1]=(ny/len*.5+.5)*255;
    nImg.data[k+2]=(1/len*.5+.5)*255;
    nImg.data[k+3]=255;
    // G = roughness, B = metalness — the channels three actually reads.
    // Window glass is near-black in the albedo, so it comes out smooth.
    const glass=lum[y*w+x]<.10;
    const rough=glass?.12:Math.min(1,Math.max(0,baseRough+(Math.random()-.5)*.10));
    oImg.data[k]  =255;                   // R: unused (AO needs a second UV set)
    oImg.data[k+1]=rough*255;
    oImg.data[k+2]=(glass?.05:baseMetal)*255;
    oImg.data[k+3]=255;
  }
  nctx.putImageData(nImg,0,0); octx.putImageData(oImg,0,0);
  return {normal:nc,orm:oc};
}

// ─── FACADE LIBRARY ──────────────────────────────────────────────────────────
// Every facade type ships an albedo map and a matching emissive map, so a wall
// is only bright where something on it is actually lit. `wu`/`hu` are the world
// sizes one tile covers, which the UVs get scaled against.
const ROOF_UV=[0.5/128,0.5/256];
function facadeTex(kind){
  const W=128,H=256;
  const ac=document.createElement('canvas'),ec=document.createElement('canvas');
  ac.width=ec.width=W; ac.height=ec.height=H;
  const a=ac.getContext('2d'),e=ec.getContext('2d');
  e.fillStyle='#000'; e.fillRect(0,0,W,H);

  const LIT=['#b6d0ff','#ffd096','#93ffdd','#ffa8cc','#d8ff9e','#8fb4ff'];
  const win=(x0,y0,w,h,p,warm)=>{
    a.fillStyle='#0c1017'; a.fillRect(x0,y0,w,h);
    if(Math.random()<p){
      e.fillStyle=warm?pick(['#ffc98a','#ffb070','#ffe0b0']):pick(LIT);
      e.globalAlpha=.5+Math.random()*.5;
      e.fillRect(x0,y0,w,h);
      e.globalAlpha=1;
    }
  };
  const stains=(n,al)=>{
    for(let i=0;i<n;i++){
      const x=Math.random()*W,y=Math.random()*H,w=rnd(4,30),h=rnd(6,60);
      a.fillStyle=`rgba(${Math.random()>.5?'0,0,0':'40,50,35'},${Math.random()*al})`;
      a.fillRect(x,y,w,h);
    }
  };
  let wu=26,hu=54,rough=.85,metal=.1,glow=1.0,relief=3.0;

  if(kind==='grid'){                     // punched windows in a concrete frame
    a.fillStyle='#7b8290'; a.fillRect(0,0,W,H);
    for(let r=0;r<16;r++){
      a.fillStyle='rgba(255,255,255,.06)'; a.fillRect(0,r*16,W,2);
      a.fillStyle='rgba(0,0,0,.32)';       a.fillRect(0,r*16+2,W,1);
    }
    for(let r=0;r<16;r++)for(let c=0;c<8;c++)win(c*16+3,r*16+4,10,10,.38);
    stains(26,.3); wu=26; hu=54; relief=3.4;

  }else if(kind==='ribbon'){             // horizontal ribbon glazing
    a.fillStyle='#68707e'; a.fillRect(0,0,W,H);
    for(let r=0;r<16;r++){
      a.fillStyle='#0d1119'; a.fillRect(0,r*16+4,W,9);
      for(let c=0;c<8;c++){
        a.fillStyle='rgba(120,140,170,.25)'; a.fillRect(c*16+15,r*16+4,1,9);
        if(Math.random()<.45){
          e.fillStyle=pick(LIT); e.globalAlpha=.35+Math.random()*.5;
          e.fillRect(c*16,r*16+4,16,9); e.globalAlpha=1;
        }
      }
    }
    stains(14,.22); wu=30; hu=56; rough=.4; metal=.5; relief=2.6;

  }else if(kind==='curtain'){            // full glass curtain wall
    a.fillStyle='#16202e'; a.fillRect(0,0,W,H);
    for(let r=0;r<32;r++)for(let c=0;c<16;c++){
      a.fillStyle=`rgba(${90+Math.random()*60|0},${120+Math.random()*70|0},${170+Math.random()*70|0},${.10+Math.random()*.22})`;
      a.fillRect(c*8,r*8,8,8);
      if(Math.random()<.30){
        e.fillStyle=pick(LIT); e.globalAlpha=.25+Math.random()*.45;
        e.fillRect(c*8+1,r*8+1,6,6); e.globalAlpha=1;
      }
    }
    for(let c=0;c<16;c++){a.fillStyle='rgba(0,0,0,.5)';a.fillRect(c*8,0,1,H);}
    for(let r=0;r<32;r++){a.fillStyle='rgba(0,0,0,.4)';a.fillRect(0,r*8,W,1);}
    wu=34; hu=60; rough=.22; metal=.75; glow=.85; relief=1.6;

  }else if(kind==='clad'){               // bolted metal cladding panels
    a.fillStyle='#5a626e'; a.fillRect(0,0,W,H);
    for(let r=0;r<8;r++)for(let c=0;c<4;c++){
      const s=rnd(.75,1.15);
      a.fillStyle=`rgba(${90*s|0},${98*s|0},${110*s|0},1)`;
      a.fillRect(c*32+1,r*32+1,30,30);
      a.fillStyle='rgba(255,255,255,.07)'; a.fillRect(c*32+1,r*32+1,30,2);
      a.fillStyle='rgba(0,0,0,.35)';       a.fillRect(c*32+1,r*32+29,30,2);
      for(let k=0;k<4;k++){                // rivets
        a.fillStyle='rgba(0,0,0,.45)';
        a.fillRect(c*32+4+(k%2)*23,r*32+4+((k/2)|0)*23,2,2);
      }
      if(Math.random()<.4)win(c*32+8,r*32+10,16,9,.55,true);
    }
    stains(30,.35); wu=30; hu=62; rough=.45; metal=.7; relief=3.8;

  }else if(kind==='ribbed'){             // vertical concrete ribs, slot windows
    a.fillStyle='#6c7078'; a.fillRect(0,0,W,H);
    for(let c=0;c<16;c++){
      a.fillStyle=c%2?'rgba(255,255,255,.09)':'rgba(0,0,0,.22)';
      a.fillRect(c*8,0,8,H);
    }
    for(let r=0;r<21;r++)for(let c=0;c<8;c++)win(c*16+5,r*12+4,6,7,.32);
    stains(34,.4); wu=24; hu=52; rough=.92; metal=.05; relief=4.2;

  }else if(kind==='louvre'){             // machine block: louvres and vents
    a.fillStyle='#454b55'; a.fillRect(0,0,W,H);
    for(let r=0;r<64;r++){
      a.fillStyle=r%2?'rgba(0,0,0,.32)':'rgba(255,255,255,.05)';
      a.fillRect(0,r*4,W,4);
    }
    for(let i=0;i<10;i++){                // glowing vent slots
      const x=Math.random()*(W-30)|0,y=Math.random()*(H-14)|0;
      a.fillStyle='#0b0e14'; a.fillRect(x,y,28,10);
      if(Math.random()<.6){
        e.fillStyle=pick(['#ff7a30','#ffb020','#30d0ff']);
        e.globalAlpha=.5+Math.random()*.4; e.fillRect(x+1,y+1,26,8); e.globalAlpha=1;
      }
    }
    stains(40,.45); wu=28; hu=48; rough=.7; metal=.55; glow=1.1; relief=4.5;

  }else if(kind==='hab'){                // old housing block, warm windows
    a.fillStyle='#7d6f63'; a.fillRect(0,0,W,H);
    for(let i=0;i<420;i++){              // mottled render
      a.fillStyle=`rgba(${Math.random()>.5?'255,255,255':'0,0,0'},${Math.random()*.10})`;
      a.fillRect(Math.random()*W,Math.random()*H,rnd(3,14),rnd(2,8));
    }
    for(let r=0;r<16;r++)for(let c=0;c<8;c++){
      win(c*16+4,r*16+3,9,9,.45,true);
      if(Math.random()<.25){             // balcony rail
        a.fillStyle='rgba(20,24,30,.85)'; a.fillRect(c*16+2,r*16+11,13,3);
      }
    }
    stains(46,.42); wu=24; hu=50; rough=.95; metal=.03; relief=3.2;

  }else{ // 'corrugated' — industrial low-rise
    a.fillStyle='#4e5348'; a.fillRect(0,0,W,H);
    for(let c=0;c<32;c++){
      a.fillStyle=c%2?'rgba(255,255,255,.08)':'rgba(0,0,0,.25)';
      a.fillRect(c*4,0,4,H);
    }
    for(let i=0;i<26;i++){                // rust
      a.fillStyle=`rgba(${120+Math.random()*60|0},${60+Math.random()*30|0},30,${Math.random()*.35})`;
      a.fillRect(Math.random()*W,Math.random()*H,rnd(6,26),rnd(8,40));
    }
    for(let c=0;c<8;c++)if(Math.random()<.5)win(c*16+4,H-40,9,12,.5,true);
    wu=26; hu=46; rough=.9; metal=.35; relief=4.0;
  }

  // Roof texel the flat tops sample
  a.fillStyle='#2c3138'; a.fillRect(0,H-1,1,1);
  e.fillStyle='#000';    e.fillRect(0,H-1,1,1);

  const mk=(c,data)=>{
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    if(!data)t.colorSpace=THREE.SRGBColorSpace;   // normal/ORM maps are data
    t.anisotropy=4;
    return t;
  };
  const dm=deriveMaps(ac,relief,rough,metal);
  return {kind,map:mk(ac),emis:mk(ec),
          norm:mk(dm.normal,true),orm:mk(dm.orm,true),
          wu,hu,rough,metal,glow,relief};
}
const FACADE_KINDS=['grid','ribbon','curtain','clad','ribbed','louvre','hab','corrugated'];
const FACADES=[];   // filled during init so the loader can breathe
// Tints so no two neighbours read the same — concrete, rust, sand, teal, plum
// Real surface colours. These multiply an already-dark albedo and are then
// converted sRGB->linear, so anything dim here compounds into a black void.
const BTINTS=[0xe0dcd2, 0xd6d0c4, 0x9ea9bd, 0xc8a089, 0xdad6cc, 0x8894a8, 0x9986ae, 0xcfc8bc, 0x788c9f, 0xcf997f, 0x85a08f, 0x646e81, 0xc4bcae, 0xa89c94];


// ─── OPTIONAL REAL TEXTURE PACKS ─────────────────────────────────────────────
// Drop seamless CC0 PBR maps (ambientCG, Poly Haven, cgbookcase) into a
// ./textures folder and name them here to override a procedural facade. Ship
// them at 512–1024px as .webp/.jpg — 4K sets will stall a phone. Anything you
// leave out keeps using the generated canvas, so you can convert one facade at
// a time. `wu`/`hu` are the world size one tile covers, in metres.
//   clad:{map:'textures/metal_diff.webp', normalMap:'textures/metal_nor.webp',
//         roughnessMap:'textures/metal_rough.webp', wu:30, hu:62}
const TEXTURE_PACKS={};

function makeSignTex(text,col){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const x=c.getContext('2d');
  const h='#'+col.toString(16).padStart(6,'0');
  x.fillStyle='#000'; x.fillRect(0,0,256,64);
  x.font='bold 28px monospace';
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=h; x.shadowBlur=20;
  x.fillStyle=h;
  x.fillText(text,128,32);
  x.shadowBlur=6; x.fillText(text,128,32);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

// Everything in skyGroup tracks the camera on X/Z so it reads as "infinitely far"
const skyGroup=new THREE.Group();
scene.add(skyGroup);
// The dome itself tracks the camera in all three axes so it can never clip the
// far plane; the horizon furniture only tracks X/Z, so flying gives it parallax.
const domeGroup=new THREE.Group();
scene.add(domeGroup);
const cloudGroup=new THREE.Group();
skyGroup.add(cloudGroup);

const skyUniforms={
  uTime:{value:0},
  cZen:{value:new THREE.Color(0x05061a).convertSRGBToLinear()},
  cMid:{value:new THREE.Color(0x1b1240).convertSRGBToLinear()},
  cGlow:{value:new THREE.Color(0x4a1a52).convertSRGBToLinear()},
  cHot:{value:new THREE.Color(0xff86b4).convertSRGBToLinear()},
  cAur:{value:new THREE.Color(0x30ffc0).convertSRGBToLinear()}
};

// Gradient dome: indigo zenith → violet → magenta smog glow at the horizon,
// with a warm hotspot in one direction and slow aurora banding up high.
const skyMat=new THREE.ShaderMaterial({
    uniforms:skyUniforms,
    vertexShader:`varying vec3 vp;void main(){vp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform float uTime; uniform vec3 cZen,cMid,cGlow,cHot,cAur;
      varying vec3 vp;
      void main(){
        vec3 d=normalize(vp);
        float h=d.y;
        vec3 col=mix(cMid,cZen,smoothstep(-0.05,0.9,h));
        col=mix(col,cGlow,clamp(exp(-max(h,-0.04)*7.0),0.0,1.0)*0.85);
        vec2 az=normalize(vec2(d.x,d.z)+vec2(1e-5));
        float hot=pow(max(dot(az,vec2(0.42,-0.91)),0.0),4.0);
        col+=cHot*hot*exp(-max(h,0.0)*8.0)*0.16;
        float band=smoothstep(0.22,0.55,h)*smoothstep(0.98,0.58,h);
        float wav=sin(d.x*4.0+uTime*0.06)*0.5+sin(d.z*3.1-uTime*0.045)*0.5;
        col+=cAur*band*(0.35+0.35*wav)*0.045;
        gl_FragColor=vec4(col,1.0);
      }`,
    side:THREE.BackSide,depthWrite:false,fog:false
});
(()=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(1600,32,24),skyMat);
  m.renderOrder=-100; m.frustumCulled=false;
  domeGroup.add(m);
})();

// ─── ENVIRONMENT MAP ─────────────────────────────────────────────────────────
// A metal with nothing to reflect renders black, which is why the city looked
// flat. Prefilter the sky dome into an environment map once at load: no
// download, and it always matches whatever the sky is doing. Swap in an HDRI
// here later (Poly Haven, CC0) if you want real captured light.
function buildEnvMap(){
  const pmrem=new THREE.PMREMGenerator(renderer);
  const tmp=new THREE.Scene();
  // the shader reads direction from the local position, so radius is irrelevant
  const dome=new THREE.Mesh(new THREE.SphereGeometry(10,32,24),skyMat);
  tmp.add(dome);
  // stand-in for the lit city below the horizon, so upward faces aren't dead
  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(9.6,24,16,0,Math.PI*2,Math.PI*.5,Math.PI*.5),
    new THREE.MeshBasicMaterial({color:0x2a1430,side:THREE.BackSide})
  );
  tmp.add(glow);
  const rt=pmrem.fromScene(tmp,0,1,60);
  scene.environment=rt.texture;
  pmrem.dispose();
  dome.geometry.dispose(); glow.geometry.dispose(); glow.material.dispose();
}

// Procedural silhouette strip: stepped megablocks, ziggurats, domes, arcology
// cones and spires, so the city never just stops at the edge of the playfield.
function skylineTex(o){
  const W=2048,H=460;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.clearRect(0,0,W,H);

  const tower=(bx,bw,bh,solid,lit)=>{
    x.fillStyle=solid;
    const r=Math.random();
    if(r<.14){                                    // ziggurat / setback stack
      let w=bw,y=H,h=bh/(2+Math.floor(Math.random()*3));
      while(y>H-bh&&w>4){
        x.fillRect(bx+(bw-w)/2,y-h,w,h);
        y-=h; w*=.62+Math.random()*.2; h*=.9;
      }
    }else if(r<.24){                              // pyramid arcology
      x.beginPath(); x.moveTo(bx,H); x.lineTo(bx+bw/2,H-bh*1.25); x.lineTo(bx+bw,H); x.closePath(); x.fill();
    }else if(r<.32){                              // domed tower
      x.fillRect(bx,H-bh,bw,bh);
      x.beginPath(); x.arc(bx+bw/2,H-bh,bw/2,Math.PI,0); x.fill();
    }else if(r<.42){                              // tapered spire
      x.beginPath(); x.moveTo(bx,H); x.lineTo(bx+bw*.18,H-bh);
      x.lineTo(bx+bw*.82,H-bh); x.lineTo(bx+bw,H); x.closePath(); x.fill();
      x.fillRect(bx+bw/2-1.5,H-bh-bh*.22,3,bh*.22);
    }else{                                        // stacked brutalist block
      x.fillRect(bx,H-bh,bw,bh);
      const n=1+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const sw=bw*(.35+Math.random()*.5),sh=bh*(.12+Math.random()*.3);
        x.fillRect(bx+Math.random()*(bw-sw),H-bh-sh,sw,sh);
      }
      if(Math.random()<.4)x.fillRect(bx+bw/2-1,H-bh*1.35,2,bh*.35); // mast
    }
    // window speckle
    if(lit){
      x.fillStyle=lit;
      const cols=Math.max(1,Math.floor(bw/7));
      for(let cx2=0;cx2<cols;cx2++)for(let ry=0;ry<Math.floor(bh/9);ry++){
        if(Math.random()>.86)x.fillRect(bx+cx2*7+2,H-bh+ry*9+3,2.5,3);
      }
    }
  };

  // Landmark megastructures, placed first so towers overlap their feet
  x.fillStyle=o.solid;
  // giant arcology cone
  x.beginPath(); x.moveTo(300,H); x.lineTo(430,H-H*.95); x.lineTo(560,H); x.closePath(); x.fill();
  // orbital tether
  x.fillRect(1180,0,3,H);
  x.fillRect(1150,H-H*.55,63,10);
  // colossal dome
  x.beginPath(); x.arc(1600,H,150,Math.PI,0); x.fill();
  x.fillRect(1450,H-40,300,40);

  let bx=-40;
  while(bx<W+40){
    const bw=o.wide?rnd(26,130):rnd(14,72);
    tower(bx,bw,rnd(H*.16,H*.78)*rnd(.55,1),o.solid,o.lit);
    bx+=bw*rnd(.55,.95);
  }

  // haze wash rising from the base
  const hz=x.createLinearGradient(0,H,0,H-H*.6);
  hz.addColorStop(0,o.haze); hz.addColorStop(1,'rgba(0,0,0,0)');
  x.globalCompositeOperation='source-atop';
  x.fillStyle=hz; x.fillRect(0,0,W,H);
  x.globalCompositeOperation='source-over';

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=THREE.RepeatWrapping;
  t.repeat.x=o.rep; t.offset.x=Math.random();
  return t;
}

function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  if(rep)t.repeat.set(rep,rep);
  t.anisotropy=4;
  t.sourceCanvas=c;
  return t;
}
// Matching normal map for a canvasTex, sharing its tiling
function canvasNormal(tex,strength){
  const n=new THREE.CanvasTexture(deriveMaps(tex.sourceCanvas,strength,1,0).normal);
  n.wrapS=n.wrapT=THREE.RepeatWrapping;
  n.repeat.copy(tex.repeat);
  n.anisotropy=4;
  return n;
}

// ─── CITY GENERATION ─────────────────────────────────────────────────────────
const neonMeshes=[];   // for animation
const blinkLights=[];  // antenna blinkers

// Pre-pool sign textures — one canvas per sign text, reused across all buildings
const SIGN_TEX=SIGNS.map(text=>makeSignTex(text,pick(NEONS)));

// Static geometry is accumulated into buckets keyed by material and merged once
// generation finishes — a few hundred greebled towers plus street clutter would
// otherwise be many thousands of draw calls.
const BUCKETS=new Map();
function pushGeo(key,mat,g){
  let b=BUCKETS.get(key);
  if(!b){b={mat,geos:[]};BUCKETS.set(key,b);}
  b.geos.push(g);
}
function place(key,mat,g,x,y,z,ry){
  if(ry)g.rotateY(ry);
  g.translate(x,y,z);
  pushGeo(key,mat,g);
}
const BOX_TILE=6;   // world units one texture tile covers on structural boxes
function addBox(key,mat,w,h,d,x,y,z,ry){
  const g=new THREE.BoxGeometry(w,h,d);
  // Without this a scanned map stretches across a whole skyway deck. Faces are
  // ordered px,nx,py,ny,pz,nz — width comes from d on the x faces, w elsewhere.
  const uv=g.attributes.uv;
  const ou=Math.random()*3, ov=Math.random()*3;
  const su=[d,d,w,w,w,w], sv=[h,h,d,d,h,h];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){
    const k=f*4+i;
    uv.setXY(k,uv.getX(k)*su[f]/BOX_TILE+ou,uv.getY(k)*sv[f]/BOX_TILE+ov);
  }
  place(key,mat,g,x,y,z,ry);
}
function flushBuckets(){
  BUCKETS.forEach(b=>{
    if(!b.geos.length)return;
    const merged=mergeGeometries(b.geos,false);
    b.geos.forEach(g=>g.dispose());
    if(!merged)return;
    const m=new THREE.Mesh(merged,b.mat);
    m.frustumCulled=false;   // everything sits inside the fog radius anyway
    scene.add(m);
  });
  BUCKETS.clear();
}

// Facade UVs are scaled so one texture tile covers wu × hu world units
function uvBox(g,w,h,d,wu,hu){
  const uv=g.attributes.uv;
  const ou=Math.random()*4, ov=Math.random()*4;
  const su=[d/wu,d/wu,0,0,w/wu,w/wu];
  const sv=[h/hu,h/hu,0,0,h/hu,h/hu];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){
    const k=f*4+i;
    if(f===2||f===3){uv.setXY(k,ROOF_UV[0],ROOF_UV[1]);continue;}
    uv.setXY(k,uv.getX(k)*su[f]+ou,uv.getY(k)*sv[f]+ov);
  }
  return g;
}
function uvCyl(g,su,sv){
  const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);
  return g;
}


// Swap in a downloaded pack for this facade if one is configured
const TEX_LOADER=new THREE.TextureLoader();
const PACK_CACHE=new Map();
function packTex(url,data,rep){
  const key=url+'|'+rep.join(',');
  let t=PACK_CACHE.get(key);
  if(!t){
    t=TEX_LOADER.load(url);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    if(!data)t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=4;
    PACK_CACHE.set(key,t);
  }
  return t;
}
function applyPack(m,F){
  const p=TEXTURE_PACKS[F.kind];
  if(!p)return;
  const rep=[p.wu||F.wu,p.hu||F.hu];
  if(p.map)          {m.map=packTex(p.map,false,rep); m.color.setHex(0xffffff);}
  if(p.normalMap)     m.normalMap=packTex(p.normalMap,true,rep);
  if(p.roughnessMap){ m.roughnessMap=packTex(p.roughnessMap,true,rep); m.metalnessMap=p.metalnessMap?packTex(p.metalnessMap,true,rep):null;
                      m.metalness=p.metalness!==undefined?p.metalness:F.metal; }
  if(p.wu)F.wu=p.wu;
  if(p.hu)F.hu=p.hu;
  m.needsUpdate=true;
}

// ─── MATERIALS ────────────────────────────────────────────────────────────────
const FACADE_MATS=new Map();
function facadeMat(fi,ti){
  const k=fi+'|'+ti;
  let m=FACADE_MATS.get(k);
  if(!m){
    const F=FACADES[fi];
    // roughness/metalness are baked into the ORM map, so the scalars are
    // multipliers left at 1
    m=new THREE.MeshStandardMaterial({
      map:F.map, color:BTINTS[ti],
      emissiveMap:F.emis, emissive:0xffffff, emissiveIntensity:F.glow,
      normalMap:F.norm, normalScale:new THREE.Vector2(.9,.9),
      roughnessMap:F.orm, metalnessMap:F.orm,
      roughness:1, metalness:1, envMapIntensity:.8
    });
    applyPack(m,F);
    FACADE_MATS.set(k,m);
  }
  return m;
}
// Weathered concrete + the blocky primary accents of a mega-block
const CONC_TINTS=[0x7d8490,0x565d68,0x373d47,0x21262e];
const CONC_MATS=CONC_TINTS.map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,metalness:.08,envMapIntensity:.7}));
CONC_MATS.forEach((m,i)=>usePack(m,'concrete',
  {tint:CONC_TINTS[i],normalScale:.8,rough:1,metal:.05,env:.7}));

const ACC_MATS=[0x9c2f28,0xc09028,0x2c5688,0xad4a22,0x27705f,0x63308a,0xa8a396].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness:.15}));
const GREEBLE_MAT=new THREE.MeshStandardMaterial({color:0x232a36,roughness:.55,metalness:.65,envMapIntensity:1.1});
// Rusted plate on the industrial greebles — rooftop kit, masts, pylons, tanks
usePack(GREEBLE_MAT,'rustplate',{tint:0x6b6f74,normalScale:1,rough:1,metal:1,env:1.1});
const RUST_MAT=new THREE.MeshStandardMaterial({color:0x4a3228,roughness:.9,metalness:.2});
// Architectural light strips are dimmed — there are a lot of them
const STRIP_MATS=NEONS.map(c=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(.38)}));
const BLINK_GEO=new THREE.SphereGeometry(.8,8,8);
const LAMP_MAT=new THREE.MeshBasicMaterial({color:0xffe6b8});

// Street furniture
const TRUNK_MAT=new THREE.MeshStandardMaterial({color:0x2e2620,roughness:.95,metalness:0});
const FOLIAGE_MATS=[0x7e2a72,0x54318c,0xa33580,0x2f6f62,0x8d3f96].map(c=>
  new THREE.MeshStandardMaterial({color:c,roughness:.95,metalness:0,
    emissive:new THREE.Color(c).multiplyScalar(.30)}));
// Sidewalks use a real scanned pack: ambientCG PavingStones038 (CC0 1.0),
// resized to 1024/768/512 and with AO+roughness packed into one file. PAVE_TILE
// is the world size one tile covers, chosen so the pavers read ~35 cm across.
const PAVE_TILE=3;
const PAVEMENT_PACK={
  map:'textures/paving_color.webp',
  normalMap:'textures/paving_normal.webp',
  orm:'textures/paving_orm.webp'        // R = ambient occlusion, G = roughness
};
const PAVE_MAT=new THREE.MeshStandardMaterial({map:paveTex,
  normalMap:canvasNormal(paveTex,2.2),normalScale:new THREE.Vector2(.8,.8),
  roughness:.55,metalness:.25,envMapIntensity:1.0});

// Swap the scans in once they arrive; the procedural canvas stays on screen
// until then, and survives untouched if the files are missing.
(()=>{
  if(!PAVEMENT_PACK)return;
  const load=(url,srgb)=>new Promise(res=>{
    TEX_LOADER.load(url,t=>{
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      if(srgb)t.colorSpace=THREE.SRGBColorSpace;
      t.anisotropy=8;
      res(t);
    },undefined,()=>res(null));
  });
  Promise.all([
    load(PAVEMENT_PACK.map,true),
    load(PAVEMENT_PACK.normalMap,false),
    load(PAVEMENT_PACK.orm,false)
  ]).then(([col,nrm,orm])=>{
    if(col){PAVE_MAT.map=col; PAVE_MAT.color.setHex(0x8f97a8);}   // tint to night
    if(nrm){PAVE_MAT.normalMap=nrm; PAVE_MAT.normalScale.set(1,1);}
    if(orm){
      PAVE_MAT.roughnessMap=orm; PAVE_MAT.aoMap=orm;
      PAVE_MAT.roughness=1; PAVE_MAT.metalness=.08; PAVE_MAT.aoMapIntensity=.7;
    }
    PAVE_MAT.needsUpdate=true;
  });
})();
const CURB_MAT=new THREE.MeshStandardMaterial({color:0x3c414c,roughness:.85,metalness:.1});

// Fake pools of light — additive discs on the pavement, no extra real lights.
// Vertex colours rather than a texture so the falloff never mips into a hard quad.
const POOL_MAT=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,
  opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false});
const POOL_COLS=[0xffc078,0x2fd0ff,0xff3f9a,0x5cff9a,0xb07cff];
function lightPool(x,z,r,ci){
  const g=new THREE.CircleGeometry(r,16); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, n=p.count, col=new Float32Array(n*3);
  const C=new THREE.Color(POOL_COLS[ci%POOL_COLS.length]);
  for(let i=0;i<n;i++){
    const f=1-Math.min(1,Math.hypot(p.getX(i),p.getZ(i))/r);
    const k=f*f;
    col[i*3]=C.r*k; col[i*3+1]=C.g*k; col[i*3+2]=C.b*k;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  place('POOL',POOL_MAT,g,x,.12,z);
}


// ─── BUILDING ────────────────────────────────────────────────────────────────
function addBuilding(bx,bz,bw,bd,bh,style){
  // Primary skin plus a contrasting one for podiums and odd tiers
  const fi=Math.floor(Math.random()*FACADES.length);
  let fi2=Math.floor(Math.random()*FACADES.length);
  if(fi2===fi)fi2=(fi2+1)%FACADES.length;
  const ti=Math.floor(Math.random()*BTINTS.length);
  const ti2=Math.floor(Math.random()*BTINTS.length);
  const F=FACADES[fi], F2=FACADES[fi2];
  const fkey='F'+fi+'_'+ti, fmat=facadeMat(fi,ti);
  const fkey2='G'+fi2+'_'+ti2, fmat2=facadeMat(fi2,ti2);
  const cki=Math.floor(Math.random()*CONC_MATS.length);
  const aci=Math.floor(Math.random()*ACC_MATS.length);
  const sci=Math.floor(Math.random()*STRIP_MATS.length);

  const M=(w,h,d,x,y,z,ry)=>place(fkey,fmat,uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F.wu,F.hu),x,y,z,ry);
  const M2=(w,h,d,x,y,z,ry)=>place(fkey2,fmat2,uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F2.wu,F2.hu),x,y,z,ry);
  const MM=(w,h,d,x,y,z,ry)=>(Math.random()<.25?M2:M)(w,h,d,x,y,z,ry);
  const C=(w,h,d,x,y,z,ry)=>addBox('C'+cki,CONC_MATS[cki],w,h,d,x,y,z,ry);
  const A=(w,h,d,x,y,z,ry)=>addBox('A'+aci,ACC_MATS[aci],w,h,d,x,y,z,ry);
  const G=(w,h,d,x,y,z,ry)=>addBox('Gr',GREEBLE_MAT,w,h,d,x,y,z,ry);
  const S=(w,h,d,x,y,z,ry)=>addBox('S'+sci,STRIP_MATS[sci],w,h,d,x,y,z,ry);
  const Gg=(g,x,y,z,ry)=>place('Gr',GREEBLE_MAT,g,x,y,z,ry);
  const Cg=(g,x,y,z,ry)=>place('C'+cki,CONC_MATS[cki],g,x,y,z,ry);

  // Slab edge where tiers meet, sometimes rimmed with a light strip
  const rim=(x,y,z,w,d)=>{
    S(w,.3,.7,x,y,z-d/2); S(w,.3,.7,x,y,z+d/2);
    S(.7,.3,d,x-w/2,y,z);  S(.7,.3,d,x+w/2,y,z);
  };
  const cornice=(x,y,z,w,d,neon)=>{
    C(w+2.2,1.7,d+2.2,x,y,z);
    if(neon)rim(x,y+1.05,z,w+2.6,d+2.6);
  };
  // Vertical structural ribs down two faces
  const ribs=(x,y,z,w,h,d)=>{
    const n=Math.min(6,Math.max(2,Math.round(w/12)));
    for(let i=0;i<n;i++){
      const rx=x-w/2+(i+.5)*(w/n);
      C(1.7,h*.94,1.2,rx,y,z+d/2+.5);
      C(1.7,h*.94,1.2,rx,y,z-d/2-.5);
    }
  };
  // Flat colour panel bolted onto a face
  const panel=(x,y,z,w,h,d)=>{
    const s=Math.floor(Math.random()*4), ph=h*rnd(.3,.8);
    if(s<2)A(w*rnd(.25,.6),ph,1.2,x+rnd(-.2,.2)*w,y,z+(s?-1:1)*(d/2+.6));
    else   A(1.2,ph,d*rnd(.25,.6),x+(s===2?1:-1)*(w/2+.6),y,z+rnd(-.2,.2)*d);
  };
  // Cantilevered platform sticking out of the mass
  const shelf=(x,y,z,w,d)=>{
    if(Math.random()<.5)C(w*rnd(1.15,1.5),1.5,d*rnd(.3,.6),x,y,z+rnd(-.2,.2)*d);
    else C(w*rnd(.3,.6),1.5,d*rnd(1.15,1.5),x+rnd(-.2,.2)*w,y,z);
  };
  // Rooftop machinery
  const roofKit=(x,y,z,w,d)=>{
    const n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const rw=rnd(2.5,Math.max(3.5,w*.3)),rd=rnd(2.5,Math.max(3.5,d*.3)),rh=rnd(1.8,5.5);
      G(rw,rh,rd,x+rnd(-.3,.3)*w,y+rh/2,z+rnd(-.3,.3)*d);
    }
    if(Math.random()<.5){
      const r=rnd(1.4,2.8),hh=rnd(3,7);
      Gg(new THREE.CylinderGeometry(r,r,hh,8),x+rnd(-.25,.25)*w,y+hh/2,z+rnd(-.25,.25)*d);
    }
    if(Math.random()<.3){
      const g=new THREE.CylinderGeometry(3.4,.5,1.6,10);
      g.rotateX(rnd(.5,1.1));
      Gg(g,x+rnd(-.3,.3)*w,y+2.4,z+rnd(-.3,.3)*d);
    }
  };
  // Mast with a red aircraft blinker
  const mast=(x,y,z,h)=>{
    Gg(new THREE.CylinderGeometry(.3,.6,h,6),x,y+h/2,z);
    const bm=new THREE.Mesh(BLINK_GEO,new THREE.MeshBasicMaterial({color:0xff2200}));
    bm.position.set(x,y+h+1.2,z);
    bm.userData={phase:Math.random()*Math.PI*2,rate:.5+Math.random()*1.5};
    scene.add(bm); blinkLights.push(bm);
  };
  // Vertical neon pinstripes up two corners
  const pinstripes=(x,y,z,w,h,d)=>{
    const hh=h*rnd(.5,.95);
    S(.5,hh,.5,x+w/2,y+hh/2,z+d/2);
    S(.5,hh,.5,x-w/2,y+hh/2,z-d/2);
  };

  let topX=bx,topZ=bz,topW=bw,topD=bd,topY=bh;

  if(style==='stack'){
    // Brutalist mega-block: offset slabs piled up, colour-panelled
    const n=3+Math.floor(Math.random()*3);
    const hs=[]; let tot=0;
    for(let i=0;i<n;i++){const v=rnd(.55,1.5);hs.push(v);tot+=v;}
    let y=0,w=bw,d=bd,x=bx,z=bz;
    for(let i=0;i<n;i++){
      const th=bh*hs[i]/tot;
      if(i){x+=rnd(-.16,.16)*w; z+=rnd(-.16,.16)*d;}
      MM(w,th,d,x,y+th/2,z);
      if(w>18&&Math.random()<.45)ribs(x,y+th/2,z,w,th,d);
      if(Math.random()<.6)panel(x,y+th*rnd(.3,.7),z,w,th,d);
      if(Math.random()<.4)shelf(x,y+th*rnd(.35,.8),z,w,d);
      if(i<n-1)cornice(x,y+th,z,w,d,Math.random()<.2);
      y+=th;
      const s=rnd(.66,.94);
      w=Math.max(9,w*s); d=Math.max(9,d*s);
    }
    topX=x; topZ=z; topW=w; topD=d; topY=y;
    cornice(x,y,z,w,d,true);

  }else if(style==='setback'){
    // Ziggurat: clean concentric setbacks, crowned with a spire
    const n=3+Math.floor(Math.random()*4);
    let y=0,w=bw,d=bd;
    for(let i=0;i<n;i++){
      const th=bh/n*rnd(.75,1.25);
      (i===0?M2:M)(w,th,d,bx,y+th/2,bz);
      if(Math.random()<.5)panel(bx,y+th*.5,bz,w,th,d);
      cornice(bx,y+th,bz,w,d,i===n-1&&Math.random()<.6);
      y+=th; w*=rnd(.7,.86); d*=rnd(.7,.86);
    }
    topW=w; topD=d; topY=y;
    if(Math.random()<.6){
      const sh=bh*rnd(.12,.3);
      Cg(new THREE.CylinderGeometry(.8,Math.min(w,d)*.3,sh,6),bx,y+sh/2,bz);
      topY=y+sh;
    }

  }else if(style==='taper'){
    // Faceted crystal tower
    const seg=pick([4,6,8]);
    const r0=Math.min(bw,bd)*.52, r1=r0*rnd(.3,.65);
    const ry=Math.random()*Math.PI;
    place(fkey,fmat,uvCyl(new THREE.CylinderGeometry(r1,r0,bh,seg,1),2*Math.PI*r0/F.wu,bh/F.hu),bx,bh/2,bz,ry);
    const rings=2+Math.floor(Math.random()*3);
    for(let i=1;i<=rings;i++){
      const t=i/(rings+1), rr=r0+(r1-r0)*t;
      Cg(new THREE.CylinderGeometry(rr+1.1,rr+1.1,2,seg),bx,bh*t,bz,ry);
      if(Math.random()<.5)place('S'+sci,STRIP_MATS[sci],new THREE.CylinderGeometry(rr+1.4,rr+1.4,.4,seg,1,true),bx,bh*t+1.3,bz,ry);
    }
    Cg(new THREE.CylinderGeometry(r1+1,r1+1,1.6,seg),bx,bh+.8,bz,ry);
    topW=r1*1.6; topD=r1*1.6; topY=bh+1.6;

  }else if(style==='core'){
    // Central shaft flanked by lower wings, linked by bridges
    const cw=bw*rnd(.34,.5), cd=bd*rnd(.34,.5);
    M(cw,bh,cd,bx,bh/2,bz);
    ribs(bx,bh/2,bz,cw,bh,cd);
    const wings=2+Math.floor(Math.random()*3);
    for(let i=0;i<wings;i++){
      const a=i/wings*Math.PI*2+rnd(-.3,.3);
      const dist=Math.max(cw,cd)*rnd(.75,1.05);
      const wx=bx+Math.cos(a)*dist, wz=bz+Math.sin(a)*dist;
      const wh=bh*rnd(.3,.72), ww=bw*rnd(.2,.32), wd=bd*rnd(.2,.32);
      M2(ww,wh,wd,wx,wh/2,wz);
      cornice(wx,wh,wz,ww,wd,Math.random()<.3);
      roofKit(wx,wh+1,wz,ww,wd);
      if(Math.random()<.7){                       // skybridge back to the core
        const by=wh*rnd(.45,.85);
        const dx=bx-wx,dz=bz-wz,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
        C(3.2,3.2,len,(bx+wx)/2,by,(bz+wz)/2,ang);
        S(.8,.3,len*.98,(bx+wx)/2,by+1.7,(bz+wz)/2,ang);
      }
    }
    topW=cw; topD=cd; topY=bh;
    cornice(bx,bh,bz,cw,cd,true);

  }else if(style==='ring'){
    // Courtyard housing block: four slabs around a void, bridged across
    const th=bh*rnd(.7,1);
    const arm=bw*.28;
    [[0,-bd/2+arm/2,bw,arm],[0,bd/2-arm/2,bw,arm],
     [-bw/2+arm/2,0,arm,bd-arm*2],[bw/2-arm/2,0,arm,bd-arm*2]].forEach((s,i)=>{
      const hh=th*rnd(.7,1.15);
      MM(s[2],hh,s[3],bx+s[0],hh/2,bz+s[1]);
      if(Math.random()<.7)panel(bx+s[0],hh*rnd(.3,.7),bz+s[1],s[2],hh,s[3]);
      cornice(bx+s[0],hh,bz+s[1],s[2],s[3],Math.random()<.3);
      if(i<2)roofKit(bx+s[0],hh+1,bz+s[1],s[2],s[3]);
    });
    const by=th*rnd(.5,.9);
    C(bw*.9,2.6,3,bx,by,bz);
    S(bw*.86,.28,.5,bx,by+1.5,bz);
    topX=bx-bw/2+arm/2; topW=arm; topD=arm; topY=th;

  }else{ // 'podium'
    // Broad podium in one material, tower in another
    const ph=Math.min(bh*.28,rnd(12,30));
    M2(bw,ph,bd,bx,ph/2,bz);
    cornice(bx,ph,bz,bw,bd,true);
    if(Math.random()<.6)panel(bx,ph*.6,bz,bw,ph,bd);
    const tw=bw*rnd(.42,.62), td=bd*rnd(.42,.62);
    const tx=bx+rnd(-.18,.18)*bw, tz=bz+rnd(-.18,.18)*bd;
    const th=bh-ph;
    const n=2+Math.floor(Math.random()*3);
    let y=ph,w=tw,d=td;
    for(let i=0;i<n;i++){
      const sh=th/n*rnd(.8,1.2);
      M(w,sh,d,tx,y+sh/2,tz);
      if(Math.random()<.45)shelf(tx,y+sh*rnd(.3,.8),tz,w,d);
      if(Math.random()<.5)panel(tx,y+sh*.5,tz,w,sh,d);
      if(i<n-1)cornice(tx,y+sh,tz,w,d,Math.random()<.2);
      y+=sh; w*=rnd(.78,.98); d*=rnd(.78,.98);
    }
    topX=tx; topZ=tz; topW=w; topD=d; topY=y;
    cornice(tx,y,tz,w,d,true);
    if(Math.random()<.5)pinstripes(tx,ph,tz,tw,th,td);
  }

  // Crown detail
  roofKit(topX,topY,topZ,topW,topD);
  if(bh>60&&Math.random()<.75)mast(topX,topY,topZ,rnd(10,26));
  if(bh<55&&Math.random()<.3){                    // domed / pyramid cap on low-rise
    if(Math.random()<.5)
      Cg(new THREE.SphereGeometry(Math.min(topW,topD)*.5,12,8,0,Math.PI*2,0,Math.PI/2),topX,topY,topZ);
    else
      Cg(new THREE.ConeGeometry(Math.min(topW,topD)*.7,Math.min(topW,topD)*.75,4),topX,topY+Math.min(topW,topD)*.37,topZ,Math.PI/4);
  }

  // Neon sign
  if(Math.random()>.4&&bh>18){
    const sm=new THREE.Mesh(
      new THREE.PlaneGeometry(16,4),
      new THREE.MeshBasicMaterial({map:pick(SIGN_TEX),transparent:true,side:THREE.DoubleSide,depthWrite:false})
    );
    const sh=6+Math.random()*(bh*.7);
    const side=Math.floor(Math.random()*4), off=.9;
    if(side===0)      sm.position.set(bx,sh,bz+bd/2+off);
    else if(side===1){sm.position.set(bx,sh,bz-bd/2-off); sm.rotation.y=Math.PI;}
    else if(side===2){sm.position.set(bx+bw/2+off,sh,bz); sm.rotation.y=-Math.PI/2;}
    else              {sm.position.set(bx-bw/2-off,sh,bz); sm.rotation.y= Math.PI/2;}
    sm.userData={phase:Math.random()*Math.PI*2};
    scene.add(sm); neonMeshes.push(sm);
    if(sh<26)lightPool(sm.position.x,sm.position.z,rnd(9,15),Math.floor(Math.random()*4));
  }
  // Tall towers carry a vertical billboard column
  if(bh>90&&Math.random()<.5){
    const bm2=new THREE.Mesh(new THREE.PlaneGeometry(6,26),
      new THREE.MeshBasicMaterial({map:pick(SIGN_TEX),transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.9}));
    bm2.rotation.z=Math.PI/2;
    const holder=new THREE.Group(); holder.add(bm2);
    const side=Math.random()<.5?1:-1;
    holder.position.set(bx+side*(bw/2+1),bh*rnd(.35,.7),bz+rnd(-.2,.2)*bd);
    holder.rotation.y=side>0?-Math.PI/2:Math.PI/2;
    holder.userData={phase:Math.random()*Math.PI*2};
    scene.add(holder);
    neonMeshes.push({material:bm2.material,userData:holder.userData});
  }

  return {x:bx,z:bz,h:bh,w:bw,d:bd};
}

// ─── STREET FURNITURE ────────────────────────────────────────────────────────
function tree(x,z){
  const h=rnd(4.5,8);
  place('TR',TRUNK_MAT,new THREE.CylinderGeometry(.28,.5,h,6),x,h/2,z);
  const fi=Math.floor(Math.random()*FOLIAGE_MATS.length);
  const n=2+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const r=rnd(1.5,2.6);
    place('FO'+fi,FOLIAGE_MATS[fi],new THREE.IcosahedronGeometry(r,0),
      x+rnd(-1.2,1.2),h+rnd(-.6,1.6),z+rnd(-1.2,1.2));
  }
}
function bin(x,z){
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.55,.45,1.3,8),x,.65,z);
  place('C3',CONC_MATS[3],new THREE.CylinderGeometry(.62,.62,.12,8),x,1.34,z);
}
function bench(x,z,ry){
  addBox('C1',CONC_MATS[1],3.6,.25,1.0,x,.75,z,ry);
  addBox('C3',CONC_MATS[3],.35,.75,.9,x-1.4,.38,z,ry);
  addBox('C3',CONC_MATS[3],.35,.75,.9,x+1.4,.38,z,ry);
}
function bollards(x,z,ry){
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  for(let i=-1;i<=1;i++){
    const ox=i*1.8;
    place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.16,.2,1.1,6),x+ox,.55,z);
    place('S'+si,STRIP_MATS[si],new THREE.CylinderGeometry(.22,.22,.14,6),x+ox,1.14,z);

}
function planter(x,z,ry){
  addBox('C2',CONC_MATS[2],3.2,1.0,1.6,x,.5,z,ry);
  const fi=Math.floor(Math.random()*FOLIAGE_MATS.length);
  for(let i=-1;i<=1;i++)
    place('FO'+fi,FOLIAGE_MATS[fi],new THREE.IcosahedronGeometry(rnd(.5,.9),0),x+i*1.1,1.3,z);
}
function kiosk(x,z,ry){
  const ai=Math.floor(Math.random()*ACC_MATS.length);
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  addBox('Gr',GREEBLE_MAT,3.4,3.0,2.6,x,1.5,z,ry);
  addBox('A'+ai,ACC_MATS[ai],4.6,.25,1.5,x,3.15,z+1.6,ry);     // awning
  addBox('S'+si,STRIP_MATS[si],3.0,.5,.2,x,2.4,z+1.35,ry);     // counter light
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.1,.1,3.4,6),x+1.9,1.7,z+1.6);
  lightPool(x,z+1,7,Math.floor(Math.random()*4));
}
function utilityBox(x,z,ry){
  addBox('Gr',GREEBLE_MAT,1.6,1.8,1.1,x,.9,z,ry);
  addBox('S1',STRIP_MATS[1],1.2,.14,.1,x,1.5,z+.6,ry);
}
function hydrant(x,z){
  place('A0',ACC_MATS[0],new THREE.CylinderGeometry(.22,.3,1.0,6),x,.5,z);
  place('A0',ACC_MATS[0],new THREE.SphereGeometry(.26,6,5),x,1.05,z);
}
function adPylon(x,z,ry){
  const si=Math.floor(Math.random()*STRIP_MATS.length);
  addBox('Gr',GREEBLE_MAT,1.4,6.5,.7,x,3.25,z,ry);
  addBox('S'+si,STRIP_MATS[si],1.0,4.4,.12,x,4.2,z+.42,ry);
  addBox('S'+si,STRIP_MATS[si],1.0,4.4,.12,x,4.2,z-.42,ry);
  lightPool(x,z,6,Math.floor(Math.random()*4));
}
function streetLamp(x,z,dir){
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.14,.22,11,8),x,5.5,z);
  place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.08,.08,3.5,6).rotateZ(Math.PI/2),x+dir*1.6,11,z);
  place('LAMP',LAMP_MAT,new THREE.SphereGeometry(.5,8,8),x+dir*3.1,10.9,z);
  lightPool(x+dir*3.1,z,11,0);
}
function addStreetProps(cx,cz){
  const R=BLOCK/2+4.5;
  for(let side=0;side<4;side++){
    const n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const t=(i+.5)/n*(BLOCK-10)-(BLOCK-10)/2+rnd(-2.5,2.5);
      let x,z,ry;
      if(side===0){x=cx+t; z=cz-R; ry=0;}
      else if(side===1){x=cx+t; z=cz+R; ry=Math.PI;}
      else if(side===2){x=cx-R; z=cz+t; ry=Math.PI/2;}
      else             {x=cx+R; z=cz+t; ry=-Math.PI/2;}
      const r=Math.random();
      if(r<.30)      tree(x,z);
      else if(r<.42) bin(x,z);
      else if(r<.53) bench(x,z,ry);
      else if(r<.63) bollards(x,z,ry);
      else if(r<.71) planter(x,z,ry);
      else if(r<.80) kiosk(x,z,ry);
      else if(r<.88) utilityBox(x,z,ry);
      else if(r<.94) hydrant(x,z);
      else           adPylon(x,z,ry);
    }
  }
}
// Paved sidewalk + curb ring for a block
function addPavement(cx,cz){
  const s=BLOCK+13;
  const g=new THREE.PlaneGeometry(s,s); g.rotateX(-Math.PI/2);
  const uv=g.attributes.uv, k=s/PAVE_TILE;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*k,uv.getY(i)*k);
  g.setAttribute('uv1',uv.clone());     // aoMap samples uv1, not uv
  place('PV',PAVE_MAT,g,cx,.09,cz);
  const h=.42;
  addBox('CB',CURB_MAT,s+1,h,1,cx,h/2,cz-s/2);
  addBox('CB',CURB_MAT,s+1,h,1,cx,h/2,cz+s/2);
  addBox('CB',CURB_MAT,1,h,s+1,cx-s/2,h/2,cz);
  addBox('CB',CURB_MAT,1,h,s+1,cx+s/2,h/2,cz);
}

// ─── JAPANESE SIGNAGE ────────────────────────────────────────────────────────
// Shop names as they actually appear on a Japanese street. Rendered through a
// CJK font stack; if a viewer's system has no Japanese face the browser falls
// back and these come out as boxes, so the latin set below stays in rotation.
const JP_SHOPS=['ラーメン','居酒屋','焼鳥','カラオケ','薬局','喫茶','寿司','定食',
                '古書店','電気','質屋','スナック','麻雀','銭湯','鰻','天ぷら',
                '珈琲','酒','肉','魚','花','パン','美容室','写真'];
const JP_FONT='"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","IPAGothic","MS Gothic",sans-serif';
const SIGN_COLS=[0xff2d3a,0xffd23a,0x2de0ff,0xff6ab0,0x8cff5a,0xffffff,0xff8a1e];

// Vertical hanging banner — the tate-kanban that lines every side street
function jpBannerTex(text,col,bg){
  const W=64,H=256;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  x.fillStyle=hex(bg); x.fillRect(0,0,W,H);
  x.strokeStyle=hex(col); x.lineWidth=3; x.strokeRect(4,4,W-8,H-8);
  x.font='36px '+JP_FONT;
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=hex(col); x.shadowBlur=16; x.fillStyle=hex(col);
  const chars=[...text].slice(0,5);
  const step=Math.min(44,(H-40)/chars.length);
  chars.forEach((ch,i)=>{
    const y=H/2-(chars.length-1)*step/2+i*step;
    x.fillText(ch,W/2,y);
    x.shadowBlur=5; x.fillText(ch,W/2,y); x.shadowBlur=16;
  });
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Horizontal shop fascia
function jpFasciaTex(text,col,bg){
  const W=256,H=64;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  x.fillStyle=hex(bg); x.fillRect(0,0,W,H);
  x.font='42px '+JP_FONT;
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=hex(col); x.shadowBlur=18; x.fillStyle=hex(col);
  x.fillText(text,W/2,H/2+2);
  x.shadowBlur=5; x.fillText(text,W/2,H/2+2);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Pooled so a few hundred shops share a handful of textures
const BANNER_MATS=[],FASCIA_MATS=[];
const SIGN_ANIM=[];        // pooled sign materials, pulsed as a group
function buildSignPools(){
  for(let i=0;i<14;i++){
    const col=pick(SIGN_COLS), bg=pick([0x0a0a0c,0x140608,0x0c1014,0x1a0d04]);
    const bm=new THREE.MeshBasicMaterial({map:jpBannerTex(pick(JP_SHOPS),col,bg),
      side:THREE.DoubleSide,transparent:true,depthWrite:false});
    const fm=new THREE.MeshBasicMaterial({map:jpFasciaTex(pick(JP_SHOPS),col,bg),
      side:THREE.DoubleSide,transparent:true,depthWrite:false});
    bm.userData.phase=Math.random()*Math.PI*2;
    fm.userData.phase=Math.random()*Math.PI*2;
    SIGN_ANIM.push(bm,fm);
    BANNER_MATS.push(bm); FASCIA_MATS.push(fm);
  }
}

// ─── SHOPFRONT ROW ───────────────────────────────────────────────────────────
// The thing a city needs to feel inhabited is frontage at human scale: warm
// interiors spilling onto the pavement, awnings, shutters, signage at eye
// level. Towers alone read as scenery, not a place.
const SHOP_WALL=[0xe8e4dc,0xd8d2c4,0xf0eee8,0xc9c4b8,0xe0d8cc].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:.05}));
const SHOP_GLOW=[0xffdca8,0xfff0d0,0xffe8b0,0xd8f0ff].map(
  c=>new THREE.MeshBasicMaterial({color:c}));
const SHUTTER_MAT=new THREE.MeshStandardMaterial({color:0x6a6f78,roughness:.7,metalness:.5});
const AWNING=[0x9c2f28,0x1f5f4a,0x2c4b88,0xb5741e,0x6a2f6a,0xc9c4b8].map(
  c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:.02}));
const VEND_GLOW=[0xff3a3a,0x3aa0ff,0xffffff].map(c=>new THREE.MeshBasicMaterial({color:c}));

function vendingMachine(x,z,ry){
  addBox('SHW0',SHOP_WALL[0],1.9,2.0,.9,x,1.0,z,ry);
  const vi=Math.random()*VEND_GLOW.length|0;
  place('VG'+vi,VEND_GLOW[vi],new THREE.BoxGeometry(1.5,1.3,.12),
        x+Math.sin(ry)*.5,1.25,z+Math.cos(ry)*.5,ry);
  if(Math.random()<.5)lightPool(x+Math.sin(ry)*1.6,z+Math.cos(ry)*1.6,2.4,1);
}

// One shop unit, built in local space then rotated onto the block edge
function shopUnit(bx,bz,ry,w,depth){
  const S=(gx,gy,gz)=>[bx+Math.cos(ry)*gx-Math.sin(ry)*gz, gy, bz+Math.sin(ry)*gx+Math.cos(ry)*gz];
  const wi=Math.random()*SHOP_WALL.length|0;
  const storeys=Math.random()<.45?2:1;
  const h=storeys===2?rnd(6.4,8.0):rnd(3.8,4.8);

  // shell
  let p=S(0,h/2,0);
  addBox('SHW'+wi,SHOP_WALL[wi],w,h,depth,p[0],p[1],p[2],ry);
  // parapet
  p=S(0,h+.35,0);
  addBox('CB',CURB_MAT,w+.5,.7,depth+.5,p[0],p[1],p[2],ry);
  // tiled plinth — stops the frontage reading as one blank slab
  p=S(0,.45,depth/2+.05);
  addBox('CB',CURB_MAT,w,.9,.28,p[0],p[1],p[2],ry);
  // party wall between neighbours
  p=S(w/2,h/2,depth/2+.02);
  addBox('CB',CURB_MAT,.22,h,.35,p[0],p[1],p[2],ry);
  // service riser and meter box down one side
  if(Math.random()<.6){
    p=S(rnd(-.4,.4)*w,h*.5,depth/2+.18);
    place('G',GREEBLE_MAT,new THREE.CylinderGeometry(.11,.11,h*.85,6),p[0],p[1],p[2]);
  }
  if(Math.random()<.45){
    p=S(rnd(-.35,.35)*w,2.9,depth/2+.22);
    addBox('G',GREEBLE_MAT,.55,.7,.3,p[0],p[1],p[2],ry);
  }

  const front=depth/2+.06;
  if(Math.random()<.72){
    // open shop: glowing interior behind glass, warm spill on the pavement
    const gw=w-1.2, gh=2.6;
    const gi=Math.random()*SHOP_GLOW.length|0;
    p=S(0,1.65,front);
    place('SG'+gi,SHOP_GLOW[gi],new THREE.BoxGeometry(gw,gh,.1),p[0],p[1],p[2],ry);
    if(Math.random()<.35){                    // sparingly: these blend additively
      p=S(0,1.65,front+.9);
      lightPool(p[0],p[2],rnd(2.8,4.2),0);
    }
    // awning
    if(Math.random()<.62){
      const ai=Math.random()*AWNING.length|0;
      p=S(0,3.35,front+.85);
      addBox('AW'+ai,AWNING[ai],w-.4,.16,1.9,p[0],p[1],p[2],ry);
      p=S(0,3.05,front+1.75);
      addBox('AW'+ai,AWNING[ai],w-.4,.75,.14,p[0],p[1],p[2],ry);
    }
  }else{
    // closed: corrugated roller shutter
    p=S(0,1.6,front);
    addBox('SHUT',SHUTTER_MAT,w-1.0,3.0,.14,p[0],p[1],p[2],ry);
  }

  // doorway offset to one side, dark against the lit window
  {
    const dx=(Math.random()<.5?-1:1)*(w/2-.85);
    p=S(dx,1.05,front+.02);
    addBox('SHUT',SHUTTER_MAT,1.0,2.1,.1,p[0],p[1],p[2],ry);
  }
  // fascia sign above the opening
  if(Math.random()<.8){
    const fi=Math.random()*FASCIA_MATS.length|0;
    p=S(0,h*(storeys===2?.62:.82),front+.12);
    place('FAS'+fi,FASCIA_MATS[fi],new THREE.PlaneGeometry(w-.3,1.9),p[0],p[1],p[2],ry);
  }
  // projecting vertical banner
  if(Math.random()<.55){
    const bi=Math.random()*BANNER_MATS.length|0;
    p=S(rnd(-.25,.25)*w,h*.52,front+1.35);
    place('BAN'+bi,BANNER_MATS[bi],new THREE.PlaneGeometry(1.3,4.2),
          p[0],p[1],p[2],ry+Math.PI/2);
  }
  // upper-floor window
  if(storeys===2){
    p=S(rnd(-.2,.2)*w,h*.75,front);
    place('SG0',SHOP_GLOW[Math.random()<.5?0:3],
          new THREE.BoxGeometry(w*.55,1.5,.08),p[0],p[1],p[2],ry);
    // aircon box
    p=S(rnd(-.3,.3)*w,h*.62,front-.1);
    addBox('G',GREEBLE_MAT,1.1,.8,.7,p[0],p[1],p[2],ry);
  }
}

// Line the road-facing edges of a block with shops
function shopRow(cx,cz){
  const depth=5.5;
  const inset=BLOCK/2+2.5-depth/2;
  const sides=[[0,1],[Math.PI,-1],[Math.PI/2,0],[-Math.PI/2,0]];
  // two of the four edges, so blocks stay varied and geometry stays bounded
  const chosen=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,2);
  chosen.forEach(si=>{
    const span=BLOCK-8;
    let t=-span/2;
    while(t<span/2-5){
      const w=rnd(4.5,8);
      if(t+w>span/2)break;
      const c=t+w/2;
      let x,z,ry;
      if(si===0){x=cx+c; z=cz-inset; ry=Math.PI;}
      else if(si===1){x=cx+c; z=cz+inset; ry=0;}
      else if(si===2){x=cx-inset; z=cz+c; ry=Math.PI/2;}
      else            {x=cx+inset; z=cz+c; ry=-Math.PI/2;}
      shopUnit(x,z,ry,w-.5,depth);
      t+=w+rnd(.2,1.0);
    }
    // a vending machine or two out on the kerb
    if(Math.random()<.5){
      const c=rnd(-.35,.35)*span;
      let x,z,ry;
      const out=BLOCK/2+3.2;
      if(si===0){x=cx+c; z=cz-out; ry=Math.PI;}
      else if(si===1){x=cx+c; z=cz+out; ry=0;}
      else if(si===2){x=cx-out; z=cz+c; ry=Math.PI/2;}
      else            {x=cx+out; z=cz+c; ry=-Math.PI/2;}
      vendingMachine(x,z,ry);
    }
  });
}

// ─── BLOCKS ──────────────────────────────────────────────────────────────────
function generateBlock(gx,gz){
  const cx=-HALF+gx*CELL+ROAD+BLOCK/2;
  const cz=-HALF+gz*CELL+ROAD+BLOCK/2;
  addPavement(cx,cz);
  shopRow(cx,cz);

  if(Math.random()<.07){
    // Park / plaza
    const pm=new THREE.Mesh(new THREE.PlaneGeometry(BLOCK-6,BLOCK-6),
      new THREE.MeshStandardMaterial({color:0x121c14,roughness:.95}));
    pm.rotation.x=-Math.PI/2; pm.position.set(cx,.14,cz); scene.add(pm);
    for(let i=0;i<9;i++)tree(cx+rnd(-1,1)*BLOCK*.36,cz+rnd(-1,1)*BLOCK*.36);
    for(let i=0;i<3;i++)bench(cx+rnd(-1,1)*BLOCK*.3,cz+rnd(-1,1)*BLOCK*.3,Math.random()*Math.PI);
    bin(cx+rnd(-8,8),cz+rnd(-8,8));
    place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(1.2,2,14,8),cx,7,cz);
    lightPool(cx,cz,16,3);
    addStreetProps(cx,cz);
    return;
  }

  // Downtown grows tall, the outskirts stay low
  const dc=Math.min(1,Math.hypot(cx,cz)/HALF);
  const scale=1.45-dc*1.0;

  const layouts=[
    [{x:0,z:0,ws:.88,ds:.88}],
    [{x:-.22,z:0,ws:.46,ds:.9},{x:.25,z:0,ws:.42,ds:.9}],
    [{x:-.24,z:-.22,ws:.44,ds:.5},{x:.24,z:-.22,ws:.42,ds:.5},{x:0,z:.24,ws:.9,ds:.42}],
  ];
  const lay=layouts[Math.floor(Math.random()*layouts.length)];
  const made=[];

  lay.forEach(l=>{
    const bw=l.ws*BLOCK*(.85+Math.random()*.15);
    const bd=l.ds*BLOCK*(.85+Math.random()*.15);
    let bh=(12+Math.pow(Math.random(),1.7)*210)*scale;
    if(Math.random()<.05)bh*=1.9;                 // occasional landmark spike
    bh=Math.max(11,bh);
    let style;
    if(bh<40)      style=pick(['stack','ring','podium','setback']);
    else if(bh<110)style=pick(['stack','setback','podium','core','taper']);
    else           style=pick(['setback','taper','core','podium','stack']);
    if(Math.min(bw,bd)<26&&style==='ring')style='stack';
    made.push(addBuilding(cx+l.x*BLOCK*.5,cz+l.z*BLOCK*.5,bw,bd,bh,style));
  });

  // Skybridge between two towers in the same block
  if(made.length>1&&Math.random()<.55){
    const a=made[0],b=made[1];
    const y=Math.min(a.h,b.h)*rnd(.4,.8);
    if(y>14){
      const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
      const ci=Math.floor(Math.random()*CONC_MATS.length);
      addBox('C'+ci,CONC_MATS[ci],3.6,3.4,len,(a.x+b.x)/2,y,(a.z+b.z)/2,ang);
      const si=Math.floor(Math.random()*STRIP_MATS.length);
      addBox('S'+si,STRIP_MATS[si],.8,.3,len*.98,(a.x+b.x)/2,y+1.8,(a.z+b.z)/2,ang);
    }
  }

  addStreetProps(cx,cz);
  if(gx<GRID&&gz<GRID){
    streetLamp(cx-BLOCK/2-ROAD/2,cz-BLOCK/2-ROAD/2,1);
    streetLamp(cx+BLOCK/2+ROAD/2,cz+BLOCK/2+ROAD/2,-1);
    if(Math.random()<.6)streetLamp(cx-BLOCK/2-ROAD/2,cz+BLOCK/2+ROAD/2,1);
  }
}

// ─── OUTER CITY ──────────────────────────────────────────────────────────────
// Simplified blocks filling the ring between the playable grid and the painted
// skyline, so the city fades into the haze instead of stopping at a hard edge.
function addOuterCity(){
  const inner=HALF+ROAD, outer=900;
  for(let i=0;i<340;i++){
    const a=Math.random()*Math.PI*2;
    const r=inner+Math.pow(Math.random(),.7)*(outer-inner);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(Math.abs(x)<HALF&&Math.abs(z)<HALF)continue;   // never inside the grid
    const fade=1-(r-inner)/(outer-inner);
    const w=rnd(30,80), d=rnd(30,80);
    const h=rnd(18,90)*(.5+fade*1.1);
    const fi=Math.floor(Math.random()*FACADES.length);
    const ti=Math.floor(Math.random()*BTINTS.length);
    const F=FACADES[fi];
    place('F'+fi+'_'+ti,facadeMat(fi,ti),
      uvBox(new THREE.BoxGeometry(w,h,d),w,h,d,F.wu,F.hu),x,h/2,z);
    if(Math.random()<.35){                            // a smaller stacked cap
      const w2=w*rnd(.4,.7), d2=d*rnd(.4,.7), h2=h*rnd(.25,.6);
      place('F'+fi+'_'+ti,facadeMat(fi,ti),
        uvBox(new THREE.BoxGeometry(w2,h2,d2),w2,h2,d2,F.wu,F.hu),
        x+rnd(-.2,.2)*w,h+h2/2,z+rnd(-.2,.2)*d);
    }
    if(h>60&&Math.random()<.3)
      place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(.3,.6,rnd(8,20),6),x,h+8,z);
  }
}

// ─── ELEVATED SKYWAYS + TRANSIT PODS ─────────────────────────────────────────
const pods=[];
function addSkyways(){
  const lines=[];
  for(let i=0;i<3;i++){
    const horiz=i%2===0;
    const ri=1+Math.floor(Math.random()*(GRID-1));
    const p=-HALF+ri*CELL+ROAD/2;
    const y=38+Math.random()*26;
    lines.push({horiz,p,y});

    const ci=2;
    if(horiz)addBox('C'+ci,CONC_MATS[ci],CITY,2.2,7,0,y,p);
    else     addBox('C'+ci,CONC_MATS[ci],7,2.2,CITY,p,y,0);
    const si=Math.floor(Math.random()*STRIP_MATS.length);
    [-3.1,3.1].forEach(o=>{                      // guide rails
      if(horiz)addBox('S'+si,STRIP_MATS[si],CITY,.18,.25,0,y+1.2,p+o);
      else     addBox('S'+si,STRIP_MATS[si],.25,.18,CITY,p+o,y+1.2,0);
    });
    for(let k=0;k<GRID;k++){                     // pylons
      const s=-HALF+k*CELL+CELL/2;
      const px=horiz?s:p, pz=horiz?p:s;
      place('Gr',GREEBLE_MAT,new THREE.CylinderGeometry(1.6,2.6,y,8),px,y/2,pz);
      addBox('C'+ci,CONC_MATS[ci],horiz?5:13,1.8,horiz?13:5,px,y-1.6,pz);
    }
  }

  // Transit pods gliding along the lines
  const podBody=new THREE.CapsuleGeometry(1.6,9,4,8);
  const podMat=new THREE.MeshStandardMaterial({color:0x2a3448,metalness:.75,roughness:.3});
  const podGlow=new THREE.MeshBasicMaterial({color:0x00c8e0});
  lines.forEach(l=>{
    for(let n=0;n<2;n++){
      const g=new THREE.Group();
      const b=new THREE.Mesh(podBody,podMat); b.rotation.x=Math.PI/2; g.add(b);
      const s=new THREE.Mesh(new THREE.BoxGeometry(2.4,.4,9),podGlow);
      s.position.y=-1.2; g.add(s);
      const dir=Math.random()>.5?1:-1, off=dir*3.1;
      if(l.horiz)g.position.set(rnd(-HALF,HALF),l.y+3.2,l.p+off);
      else{g.position.set(l.p+off,l.y+3.2,rnd(-HALF,HALF)); g.rotation.y=Math.PI/2;}
      g.userData={axis:l.horiz?'x':'z',spd:rnd(55,85)*dir};
      scene.add(g); pods.push(g);
    }
  });
}

// ─── NPC CARS ─────────────────────────────────────────────────────────────────
const cars=[];

// Shared car materials — created once, reused across all cars
const CAR_MATS=[0x334466,0x553333,0x335533,0x444455,0x553355,0x224488,0x445544].map(
  c=>new THREE.MeshBasicMaterial({color:c})
);
const CAR_CABIN_MAT=new THREE.MeshBasicMaterial({color:0x0a1520});
const CAR_HL_MAT=new THREE.MeshBasicMaterial({color:0xffffff});
const CAR_TL_MAT=new THREE.MeshBasicMaterial({color:0xff1100});

// Shared car geometries
const CAR_BODY_GEO=new THREE.BoxGeometry(3.5,1.3,7.5);
const CAR_CAB_GEO=new THREE.BoxGeometry(2.8,1.1,3.8);
const CAR_LIGHT_GEO=new THREE.BoxGeometry(.4,.25,.2);

function spawnCars(){
  for(let i=0;i<40;i++){
    const g=new THREE.Group();
    // Body — just add the mesh, no Object.assign needed
    const body=new THREE.Mesh(CAR_BODY_GEO,pick(CAR_MATS));
    g.add(body);
    // Cabin
    const cab=new THREE.Mesh(CAR_CAB_GEO,CAR_CABIN_MAT);
    cab.position.set(0,1.2,-0.4); g.add(cab);
    // Headlights / taillights — shared geo + mat
    [-1.2,1.2].forEach(sx=>{
      const hl=new THREE.Mesh(CAR_LIGHT_GEO,CAR_HL_MAT);
      hl.position.set(sx,0,3.7); g.add(hl);
      const tl=new THREE.Mesh(CAR_LIGHT_GEO,CAR_TL_MAT);
      tl.position.set(sx,0,-3.7); g.add(tl);
    });

    g.position.y=1.2;
    const horiz=Math.random()>.5;
    const ri=Math.floor(Math.random()*GRID);
    const rp=-HALF+ri*CELL+ROAD/2+Math.random()*4-2;
    const sp=(Math.random()-.5)*CITY;
    const dir=Math.random()>.5?1:-1;
    const lane=dir*(4+Math.random()*4);
    if(horiz){
      g.position.set(sp,1.2,rp+lane);
      g.rotation.y=dir>0?0:Math.PI;
      g.userData={axis:'x',spd:(15+Math.random()*25)*dir};
    }else{
      g.position.set(rp+lane,1.2,sp);
      g.rotation.y=dir>0?-Math.PI/2:Math.PI/2;
      g.userData={axis:'z',spd:(15+Math.random()*25)*dir};
    }
    scene.add(g); cars.push(g);
  }
}

// ─── DRONES ──────────────────────────────────────────────────────────────────
const drones=[];
function spawnDrones(){
  for(let i=0;i<22;i++){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(
      new THREE.BoxGeometry(2,.4,2),
      new THREE.MeshStandardMaterial({color:0x223344,metalness:.8})
    ));
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([rx,rz])=>{
      const r=new THREE.Mesh(
        new THREE.CylinderGeometry(.55,.55,.1,8),
        new THREE.MeshStandardMaterial({color:0x445566,metalness:.9})
      );
      r.position.set(rx,.25,rz); r.userData.rotor=true; g.add(r);
    });
    const gl=new THREE.Mesh(
      new THREE.SphereGeometry(.2,8,8),
      new THREE.MeshBasicMaterial({color:0x00ff88})
    );
    g.add(gl);

    g.position.set(rnd(-HALF,HALF),rnd(35,130),rnd(-HALF,HALF));
    g.userData={
      cx:g.position.x, cz:g.position.z,
      ang:Math.random()*Math.PI*2,
      spd:rnd(4,14),
      rad:rnd(20,90),
      by:g.position.y,
      bspd:rnd(.4,1.2),
      bamp:rnd(3,8)

}

// Flying cars at mid-altitude
const flyingCars=[];

// ─── RAIN ─────────────────────────────────────────────────────────────────────
let rain;
function createRain(){
  const N=2400;
  const pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=rnd(-250,250); pos[i*3+1]=rnd(0,250); pos[i*3+2]=rnd(-250,250);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  rain=new THREE.Points(g,new THREE.PointsMaterial({
    color:0x6688aa,size:.4,transparent:true,opacity:.55,sizeAttenuation:true
  }));
  scene.add(rain);
}

// ─── PLAYER ──────────────────────────────────────────────────────────────────
const P={
  pos:new THREE.Vector3(CELL*1.5,2.5,CELL*1.5),
  yaw:0, pitch:0,
  mode:'foot',
  spd:0
};
camera.position.copy(P.pos);
camera.rotation.order='YXZ';

const SPEEDS={foot:14,car:55,fly:75};
const HEIGHTS={foot:1.7,car:2.2};

// ─── INPUT ───────────────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(e.code==='Digit1')setMode('foot');
  if(e.code==='Digit2')setMode('car');
  if(e.code==='Digit3')setMode('fly');
});
document.addEventListener('keyup',e=>{K[e.code]=false});

const IS_TOUCH='ontouchstart' in window||navigator.maxTouchPoints>0;
let mdx=0,mdy=0,locked=false;
canvas.addEventListener('click',()=>{if(!IS_TOUCH)canvas.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas});
document.addEventListener('mousemove',e=>{if(locked){mdx+=e.movementX;mdy+=e.movementY}});

// Joystick state
const JS={L:{on:false,dx:0,dy:0},R:{on:false,dx:0,dy:0}};
function setupStick(el,knob,side){
  const R=46;
  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    JS[side]={on:true,sx:t.clientX,sy:t.clientY,dx:0,dy:0};
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    const s=JS[side]; if(!s.on)return;
    const t=e.changedTouches[0];
    let dx=t.clientX-s.sx, dy=t.clientY-s.sy;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len>R){dx=dx/len*R;dy=dy/len*R;}
    s.dx=dx/R; s.dy=dy/R;
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  },{passive:false});
  const end=e=>{
    e.preventDefault();
    JS[side].on=false; JS[side].dx=0; JS[side].dy=0;
    knob.style.transform='translate(-50%,-50%)';
  };
  el.addEventListener('touchend',end,{passive:false});
  el.addEventListener('touchcancel',end,{passive:false});
}
setupStick(document.getElementById('lj'),document.getElementById('lk'),'L');
setupStick(document.getElementById('rj'),document.getElementById('rk'),'R');

let vInput=0;
const upb=document.getElementById('upb'), dnb=document.getElementById('dnb');
upb.addEventListener('touchstart',e=>{e.preventDefault();vInput=1},{passive:false});
upb.addEventListener('touchend',e=>{e.preventDefault();vInput=0},{passive:false});
dnb.addEventListener('touchstart',e=>{e.preventDefault();vInput=-1},{passive:false});
dnb.addEventListener('touchend',e=>{e.preventDefault();vInput=0},{passive:false});
upb.addEventListener('mousedown',()=>vInput=1); upb.addEventListener('mouseup',()=>vInput=0);
dnb.addEventListener('mousedown',()=>vInput=-1); dnb.addEventListener('mouseup',()=>vInput=0);

document.querySelectorAll('.mb').forEach(b=>{
  b.addEventListener('click',()=>setMode(b.dataset.m));
  b.addEventListener('touchend',e=>{e.preventDefault();setMode(b.dataset.m)});
});

function setMode(m){
  P.mode=m;
  document.getElementById('mode-disp').textContent=m.toUpperCase();
  document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m!=='fly'){ P.pos.y=HEIGHTS[m]; P.pitch=0; }
}

// ─── MINIMAP ─────────────────────────────────────────────────────────────────
const mmc=document.getElementById('map-c');
const mmx=mmc.getContext('2d');
function drawMap(){
  const S=110;
  mmx.fillStyle='#03070f'; mmx.fillRect(0,0,S,S);
  mmx.strokeStyle='#112233'; mmx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    const p=i/GRID*S;
    mmx.beginPath(); mmx.moveTo(p,0); mmx.lineTo(p,S); mmx.stroke();
    mmx.beginPath(); mmx.moveTo(0,p); mmx.lineTo(S,p); mmx.stroke();
  }
  // Cars
  mmx.fillStyle='#334466';
  cars.forEach(c=>{
    const mx=(c.position.x+HALF)/CITY*S, mz=(c.position.z+HALF)/CITY*S;
    mmx.fillRect(mx-1,mz-1,2,2);
  });
  // Drones
  mmx.fillStyle='#004422';
  drones.forEach(d=>{
    const mx=(d.position.x+HALF)/CITY*S, mz=(d.position.z+HALF)/CITY*S;
    mmx.fillRect(mx-1,mz-1,2,2);
  });
  // Player
  const px=(P.pos.x+HALF)/CITY*S, pz=(P.pos.z+HALF)/CITY*S;
  mmx.fillStyle='#00ffff';
  mmx.beginPath(); mmx.arc(px,pz,3,0,Math.PI*2); mmx.fill();
  mmx.strokeStyle='#00ffff'; mmx.lineWidth=1;
  mmx.beginPath(); mmx.moveTo(px,pz);
  mmx.lineTo(px+Math.sin(P.yaw)*9, pz+Math.cos(P.yaw)*9); mmx.stroke();
}

// ─── UPDATE PLAYER ────────────────────────────────────────────────────────────
function updatePlayer(dt){
  // Look
  const MSENS=.0018, TSENS=2.2;
  if(locked){ P.yaw-=mdx*MSENS; P.pitch-=mdy*MSENS; }
  if(JS.R.on){ P.yaw-=JS.R.dx*TSENS*dt; P.pitch-=JS.R.dy*TSENS*dt; }
  mdx=0; mdy=0;
  P.pitch=Math.max(-Math.PI/2.1,Math.min(Math.PI/2.1,P.pitch));

  // Move inputs
  let fwd=0,str=0,vrt=0;
  if(K.KeyW||K.ArrowUp)fwd=1;
  if(K.KeyS||K.ArrowDown)fwd=-1;
  if(K.KeyD||K.ArrowRight)str=1;
  if(K.KeyA||K.ArrowLeft)str=-1;
  if(K.Space||K.KeyE)vrt=1;
  if(K.ShiftLeft||K.KeyQ)vrt=-1;
  if(JS.L.on){ fwd=-JS.L.dy; str=JS.L.dx; }
  vrt+=vInput;

  const spd=SPEEDS[P.mode];
  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);

  if(P.mode==='fly'){
    // 3D flight: forward follows pitch
    const fsin=Math.sin(P.pitch), fcos=Math.cos(P.pitch);
    const wx=fwd*(-sin*fcos)+str*cos;
    const wy=fwd*fsin;
    const wz=fwd*(-cos*fcos)+str*(-sin);
    P.pos.x+=wx*spd*dt;
    P.pos.y+=wy*spd*dt+vrt*spd*.5*dt;
    P.pos.z+=wz*spd*dt;
    P.pos.y=Math.max(5,P.pos.y);
  } else {
    // Ground
    const wx=fwd*(-sin)+str*cos;
    const wz=fwd*(-cos)+str*(-sin);
    P.pos.x+=wx*spd*dt;
    P.pos.z+=wz*spd*dt;
    P.pos.y=HEIGHTS[P.mode];
  }

  // Wrap city bounds
  if(P.pos.x> HALF)P.pos.x=-HALF;
  if(P.pos.x<-HALF)P.pos.x= HALF;
  if(P.pos.z> HALF)P.pos.z=-HALF;
  if(P.pos.z<-HALF)P.pos.z= HALF;

  // Speed display
  const len2d=Math.sqrt(
    (P.pos.x-camera.position.x)**2+(P.pos.z-camera.position.z)**2
  );
  P.spd=len2d/dt*3.6;

  camera.position.copy(P.pos);
  camera.rotation.y=P.yaw;
  camera.rotation.x=P.pitch;
}

// ─── UPDATE NPCS ──────────────────────────────────────────────────────────────
function updateNPCs(dt,t){
  cars.forEach(c=>{
    c.position[c.userData.axis]+=c.userData.spd*dt;
    if(c.position[c.userData.axis]>HALF)c.position[c.userData.axis]=-HALF;
    if(c.position[c.userData.axis]<-HALF)c.position[c.userData.axis]=HALF;
  });

  flyingCars.forEach(c=>{
    c.position[c.userData.axis]+=c.userData.spd*dt;
    if(c.position[c.userData.axis]>HALF)c.position[c.userData.axis]=-HALF;
    if(c.position[c.userData.axis]<-HALF)c.position[c.userData.axis]=HALF;
  });

  pods.forEach(p=>{
    p.position[p.userData.axis]+=p.userData.spd*dt;
    if(p.position[p.userData.axis]>HALF)p.position[p.userData.axis]=-HALF;
    if(p.position[p.userData.axis]<-HALF)p.position[p.userData.axis]=HALF;
  });

  drones.forEach(d=>{
    const u=d.userData;
    u.ang+=u.spd*dt*.022;
    d.position.x=u.cx+Math.cos(u.ang)*u.rad;
    d.position.z=u.cz+Math.sin(u.ang)*u.rad;
    d.position.y=u.by+Math.sin(t*u.bspd)*u.bamp;
    d.rotation.y=u.ang+Math.PI/2;
    d.children.forEach(ch=>{if(ch.userData.rotor)ch.rotation.y+=8*dt;});
  });

  holoMeshes.forEach(h=>{
    h.rotation.x+=h.userData.rx*dt;
    h.rotation.y+=h.userData.ry*dt;
    h.rotation.z+=h.userData.rz*dt;
  });
}

// ─── UPDATE RAIN ──────────────────────────────────────────────────────────────
function updateRain(dt){
  if(!rain)return;
  const p=rain.geometry.attributes.position.array;
  const N=p.length/3;
  for(let i=0;i<N;i++){
    p[i*3+1]-=55*dt;
    if(p[i*3+1]<0){
      p[i*3]=P.pos.x+rnd(-250,250);
      p[i*3+1]=P.pos.y+rnd(150,260);
      p[i*3+2]=P.pos.z+rnd(-250,250);
    }
  }
  rain.geometry.attributes.position.needsUpdate=true;
}

// ─── ANIMATE SCENE ELEMENTS ───────────────────────────────────────────────────
function updateAnim(t,dt){
  // Sky follows the player on X/Z so the horizon stays at infinity
  skyGroup.position.set(camera.position.x,0,camera.position.z);
  domeGroup.position.copy(camera.position);
  skyUniforms.uTime.value=t;
  cloudGroup.rotation.y+=dt*0.004;
  // Neon sign pulse
  neonMeshes.forEach(m=>{
    const v=.85+.15*Math.sin(t*1.8+m.userData.phase);
    m.material.opacity=v;
  });
  // Shop signage: a few dozen shared materials rather than ~1800 meshes
  for(let i=0;i<SIGN_ANIM.length;i++){
    const m=SIGN_ANIM[i];
    m.opacity=.88+.12*Math.sin(t*1.6+m.userData.phase);
  }
  // Antenna blinks
  blinkLights.forEach(b=>{
    const on=Math.sin(t*b.userData.rate*Math.PI*2+b.userData.phase)>.5;
    b.material.color.setHex(on?0xff2200:0x220000);
  });
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
const spdEl=document.getElementById('spd');
function updateHUD(){
  spdEl.innerHTML=`${Math.round(P.spd)}<small>KM/H</small>`;
}

// ─── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=W()/H();

// ─── LOADING ─────────────────────────────────────────────────────────────────
function setLoad(pct,txt){
  document.getElementById('lbar').style.width=pct+'%';
  document.getElementById('ltxt').textContent=txt;
}
const tick=ms=>new Promise(r=>setTimeout(r,ms));

async function init(){
  try{
    setLoad(8,'INITIALIZING RENDERER...');  await tick(40);
    for(let i=0;i<FACADE_KINDS.length;i++){
      FACADES.push(facadeTex(FACADE_KINDS[i]));
      setLoad(8+i,'WEAVING FACADES...'); await tick(0);
    }
    setLoad(18,'CALIBRATING HORIZON...');    await tick(30);
    buildEnvMap();
    setLoad(24,'PREFILTERING REFLECTIONS...'); await tick(20);
    buildSignPools();
    setLoad(30,'CONSTRUCTING CITY...');
    for(let gx=0;gx<GRID;gx++){
      for(let gz=0;gz<GRID;gz++) generateBlock(gx,gz);
      if(gx%3===0){setLoad(30+gx*4,'CONSTRUCTING CITY...'); await tick(10);}
    }
    setLoad(62,'EXTENDING SPRAWL...');       await tick(20);
    addOuterCity();
    setLoad(66,'RAISING SKYWAYS...');        await tick(20);
    addSkyways();
    setLoad(70,'WELDING STRUCTURES...');     await tick(30);
    flushBuckets(); await tick(20);
    setLoad(76,'SPAWNING TRAFFIC...');       await tick(30);
    spawnCars(); await tick(20);
    spawnFlyingCars();
    setLoad(82,'LAUNCHING DRONES...');       await tick(30);
    spawnDrones();
    setLoad(88,'SPAWNING HOLOGRAMS...');     await tick(20);
    spawnHolograms();
    setLoad(93,'STARTING WEATHER...');       await tick(20);
    createRain();
    setLoad(100,'MEGACITY ONLINE');          await tick(400);
    document.getElementById('enter-btn').style.display='block';
  }catch(e){
    console.error('Init failed:',e);
    document.getElementById('ltxt').textContent='ERROR: '+e.message;
    document.getElementById('ltxt').style.color='#ff4444';
  }
}

document.getElementById('enter-btn').addEventListener('click',startGame);
document.getElementById('enter-btn').addEventListener('touchend',e=>{e.preventDefault();startGame();});

function startGame(){
  document.getElementById('load').style.transition='opacity .6s';
  document.getElementById('load').style.opacity='0';
  setTimeout(()=>document.getElementById('load').style.display='none',600);
  if(!IS_TOUCH)canvas.requestPointerLock();
  requestAnimationFrame(loop);
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(dt<=0)return;
  const t=now/1000;
  updatePlayer(dt);
  updateNPCs(dt,t);
  updateRain(dt);
  updateAnim(t,dt);
  drawMap();
  updateHUD();
  composer.render();
}

init();
